name: Bake illustrated cellar materials

on:
  push:
    branches: [main]
    paths:
      - 'tools/bake_illustrated_materials.py'
      - 'assets/scene/cellar_scene_gate.png'
      - 'assets/scene/cellar_stone_atlas.jpg'
      - 'assets/props/dungeon_gate_art_v2.webp'
      - '.github/workflows/bake-cellar-art.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cellar-art-assets
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pillow>=10,<13'
      - name: Bake atlas from author-approved original art
        run: python tools/bake_illustrated_materials.py
      - name: Verify texture atlas exists
        run: |
          test -s assets/scene/dungeon_illustrated_atlas.webp
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/scene/dungeon_illustrated_atlas.webp')
          assert im.size==(384,256),im.size
          print('Atlas',im.size,im.mode)
          PY
      - name: Commit produced artwork to main
        run: |
          git add assets/scene/dungeon_illustrated_atlas.webp
          if git diff --cached --quiet; then echo "Already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bake seamless pixel-art material atlas from source illustrations"
          git push origin HEAD:main
