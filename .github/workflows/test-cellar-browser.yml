name: Browser visual smoke test

on:
  push:
    branches: [main]
    paths:
      - 'cellar.html'
      - 'blueprint.html'
      - 'assets/js/**'
      - 'assets/props/dungeon_illustrated_gates.webp'
      - 'assets/scene/dungeon_illustrated_atlas.webp'
      - 'tools/test_cellar_browser.py'
      - '.github/workflows/test-cellar-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Launch local version of GitHub Pages and render
        run: |
          python -m http.server 8899 --bind 127.0.0.1 >/tmp/darkness-server.log 2>&1 &
          sleep 2
          python tools/test_cellar_browser.py
      - name: Preserve rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellar-visual-screenshots
          path: artifacts/
          if-no-files-found: warn
