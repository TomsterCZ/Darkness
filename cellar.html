/*BOARD-BEGIN*/const BOARD={"OX":564.1,"OY":80.2,"HW":37.6,"HH":19.2,"cells":[[-1,0,581.0,90.8,0.05,0.5,0],[0,0,546.2,108.5,0.98,0.5,0],[1,0,511.5,126.3,1.9,0.5,0],[2,0,476.7,144.0,2.83,0.5,0],[3,0,441.9,161.8,3.75,0.5,0],[4,0,406.8,182.3,4.75,0.57,0],[5,0,370.9,199.2,5.67,0.53,0],[6,0,334.9,216.0,6.58,0.49,0],[7,0,298.9,232.9,7.5,0.45,0],[8,0,262.9,249.7,8.42,0.41,0],[-1,1,621.3,100.9,-0.22,1.3,0],[0,1,583.9,120.0,0.77,1.3,0],[1,1,546.6,139.0,1.77,1.3,0],[2,1,509.3,158.1,2.76,1.3,0],[3,1,472.0,177.2,3.75,1.3,0],[4,1,440.1,199.3,4.75,1.45,0],[5,1,404.6,216.4,5.67,1.43,0],[6,1,369.1,233.5,6.58,1.4,0],[7,1,333.6,250.6,7.5,1.37,0],[8,1,298.2,267.7,8.42,1.35,0],[-1,2,671.6,113.6,-0.56,2.3,0],[0,2,636.8,131.4,0.37,2.3,0],[1,2,602.0,149.2,1.29,2.3,0],[2,2,567.1,167.0,2.22,2.3,0],[4,2,473.3,216.2,4.75,2.34,0],[5,2,438.3,233.6,5.67,2.32,0],[6,2,403.4,251.0,6.58,2.31,0],[7,2,368.4,268.3,7.5,2.3,0],[8,2,333.4,285.7,8.42,2.28,0],[4,3,506.6,233.2,4.75,3.22,0],[5,3,472.1,250.8,5.67,3.22,0],[6,3,437.6,268.5,6.58,3.22,0],[7,3,403.1,286.1,7.5,3.22,0],[8,3,368.6,303.7,8.42,3.22,0],[9,3,338.5,329.8,9.5,3.5,0],[10,3,302.8,350.0,10.5,3.55,0],[0,4,752.9,179.7,0.08,5.1,0],[1,4,710.0,201.5,1.22,5.1,0],[2,4,667.1,223.4,2.36,5.1,0],[3,4,624.3,245.3,3.5,5.1,0],[9,4,376.1,349.0,9.5,4.5,0],[10,4,340.4,363.4,10.35,4.4,0],[0,5,781.6,194.3,0.08,5.86,0],[1,5,740.7,217.2,1.22,5.92,0],[2,5,699.8,240.1,2.36,5.97,0],[3,5,658.9,263.0,3.5,6.02,0],[4,5,619.7,272.6,4.27,5.75,0],[5,5,578.7,293.6,5.36,5.75,0],[6,5,537.6,314.5,6.46,5.75,0],[7,5,496.5,335.5,7.55,5.75,0],[8,5,455.4,356.5,8.64,5.75,0],[9,5,413.7,372.0,9.6,5.6,0],[16,5,223,503,20.0,20.0,1],[0,6,810.3,209.0,0.08,6.63,0],[1,6,771.4,232.9,1.22,6.73,0],[2,6,732.4,256.8,2.36,6.84,0],[3,6,693.5,280.7,3.5,6.94,0],[4,6,655.8,291.0,4.27,6.71,0],[5,6,614.7,311.9,5.36,6.71,0],[6,6,573.6,332.9,6.46,6.71,0],[7,6,533.8,354.5,7.55,6.74,0],[8,6,494.2,376.3,8.64,6.78,0],[15,6,298,506,20.0,20.0,1],[16,6,260,522,20.0,20.0,1],[17,6,223,538,20.0,20.0,1],[0,7,864.9,2 [754,432.5],[638,512.5],[616,501.5]]},{"n":"W8b","box":[9.76,10.75,7.08,12.07],"hull":[[426,383.5],[448,372.5],[651,460.5],[651,499.5],[629,510.5],[426,422.5]]},{"n":"W8j","box":[10.46,11.5,6.83,7.44],"hull":[[392.6,395.3],[427.6,373.3],[446.4,382.7],[446.4,421.7],[411.4,443.7],[392.6,434.3]]},{"n":"W8a","box":[11.18,12.57,3.36,7.24],"hull":[[218,347],[246,333],[416,395],[416,434],[388,448],[218,386]]},{"n":"W9b","box":[10.17,12.07,2.9,3.48],"hull":[[222.6,330.3],[290.6,292.3],[309.4,301.7],[309.4,340.7],[241.4,378.7],[222.6,369.3]]},{"n":"W9a","box":[9.91,10.47,0.61,3.36],"hull":[[195.6,252.7],[214.4,243.3],[315.4,297.3],[315.4,336.3],[296.6,345.7],[195.6,291.7]]},{"n":"W5a","box":[-0.73,-0.16,7.91,8.53],"hull":[[871,190.9],[889,179.0],[909,190.0],[909,229.0],[891,240.9],[871,229.9]]},{"n":"W5b","box":[0.92,3.65,8.13,9.05],"hull":[[747,274.0],[835,215.0],[855,226.0],[855,265.0],[767,324.0],[747,313.0]]}]};/*BOARD-END*/
const {OX,OY,HW,HH}=BOARD;
// Level: solver-verified (tools/sokoban_gen.cpp). Crates are pushed, never pulled.
const START=[8,0];
const CRATES_START=[[3,5],[5,5],[4,6],[5,6]];
const GOALS=[[0,4],[1,4],[0,5],[1,5]];
const GATE_TOP=[8,6];          // platform cell straight above the barred gate
const GATE_LOW=[13,9];         // standing in the gate mouth on the low ground
const KEY_CELL=[16,6];         // the key lies on the low ground south-west of the gate
const PORTAL=[-2,8];           // threshold of the east arch
const VAULT=[[454,512],[454,462],[458,450],[468,443],[482,442],[497,448],[508,458],[516,472],[516,536]];

const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const scene=document.createElement('canvas');scene.width=1085;scene.height=566;const sctx=scene.getContext('2d');sctx.imageSmoothingEnabled=false;
const img=src=>{const i=new Image();i.src=src;return i;};
const bg=img('assets/scene/cellar_scene_gate.png'),crateImg=img('assets/props/crate_pixel.png'),keyImg=img('assets/props/cellar_key.png');
const heroFrames={idle:img('assets/character/idle/00.png')};
for(const dir of ['walk_right','walk_left'])for(let i=0;i<10;i++)heroFrames[dir+i]=img('assets/character/'+dir+'/'+String(i).padStart(2,'0')+'.png');
const ready=i=>i.complete&&i.naturalWidth>0;

// ---- geometry -------------------------------------------------------------------------------
const k=(x,y)=>x+','+y;
// Every cell carries its own spot in the painting (x,y) and its place on the paving lattice (lc,lr),
// which decides what stands in front of what. Cells exist only where the floor is visibly open.
const POS=new Map(BOARD.cells.map(([c,r,x,y,lc,lr,ho])=>[k(c,r),{x,y,lc,lr,ho:!!ho}]));
const cen=(x,y)=>POS.get(k(x,y));
const floor=new Set(POS.keys());
const blocked=new Set();for(const [a,b] of BOARD.blocked){blocked.add(k(...a)+'>'+k(...b));blocked.add(k(...b)+'>'+k(...a));}
const WALLS=BOARD.walls.map(w=>{const path=new Path2D();w.hull.forEach((p,i)=>i?path.lineTo(p[0],p[1]):path.moveTo(p[0],p[1]));path.closePath();
  const xs=w.hull.map(p=>p[0]),ys=w.hull.map(p=>p[1]);return {box:w.box,path,x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};});
const heroOnly=(x,y)=>!!POS.get(k(x,y))?.ho;
const KEY_POS=[cen(...KEY_CELL).x,cen(...KEY_CELL).y+2];
const isFloor=(x,y)=>floor.has(k(x,y));
const canStep=(x,y,dx,dy)=>isFloor(x+dx,y+dy)&&!blocked.has(k(x,y)+'>'+k(x+dx,y+dy));
if(![START,GATE_TOP,GATE_LOW,KEY_CELL,PORTAL,...CRATES_START,...GOALS].every(p=>isFloor(...p))||CRATES_START.length!==GOALS.length)throw Error('Invalid level');
const DELTAS=[[1,0],[-1,0],[0,1],[0,-1]];
// Where a step in direction (dx,dy) leads, or null. Once the gate is raised, stepping "into" the parapet
// above it takes the hero down through the gate to the low ground, and back again.
function stepTo(x,y,dx,dy){
 if(canStep(x,y,dx,dy))return [x+dx,y+dy];
 if(sealedAt!==0&&dy===0){if(dx===1&&x===GATE_TOP[0]&&y===GATE_TOP[1])return [...GATE_LOW];if(dx===-1&&x===GATE_LOW[0]&&y===GATE_LOW[1])return [...GATE_TOP];}
 return null;}

// ---- state ----------------------------------------------------------------------------------
const SAVE='darkness_cellar_v14';
const hint=document.querySelector('#hint'),ending=document.querySelector('#win'),invEl=document.querySelector('#inv');
const ambient=document.querySelector('#ambient'),victory=document.querySelector('#victory');ambient.volume=.25;victory.volume=.42;
let actor,crates,history,pending,tween,facing,moves,pushes;
let sealedAt,hasKey,exitWalk,finished;                     // the one-way chain: seals -> vault grate -> key -> portal
let muted=false,hasInteracted=false,audio=null,hintTimer=0;
function reset(){actor=[...START];crates=CRATES_START.map(p=>[...p]);history=[];pending=[];tween=null;facing='walk_right';moves=0;pushes=0;
 sealedAt=0;hasKey=false;exitWalk=null;finished=false;invEl.classList.remove('has');ending.classList.remove('show');}
reset();
const crateAt=(x,y)=>crates.findIndex(b=>b[0]===x&&b[1]===y);
const sealed=()=>sealedAt!==0;
function message(s,duration=3400){hint.textContent=s;hint.classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.remove('show'),duration);}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({actor,crates,moves,pushes,sealed:sealed(),hasKey,finished}));}catch(e){}}
function restore(){try{
 const a=JSON.parse(localStorage.getItem(SAVE));if(!a||!Array.isArray(a.actor)||!Array.isArray(a.crates)||a.crates.length!==GOALS.length)return;
 if(!isFloor(...a.actor)||a.crates.some(p=>!Array.isArray(p)||!isFloor(...p)))return;
 const set=new Set(a.crates.map(p=>k(...p)));if(set.size!==GOALS.length||set.has(k(...a.actor)))return;
 if(a.finished)return;                                      // a finished run starts over
 actor=[...a.actor];crates=a.crates.map(p=>[...p]);moves=a.moves|0;pushes=a.pushes|0;
 if(a.sealed){sealedAt=-1e9;hasKey=!!a.hasKey;invEl.classList.toggle('has',hasKey);}
 }catch(e){}}

// ---- sound ----------------------------------------------------------------------------------
function wake(){hasInteracted=true;
 try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume?.();}catch(e){}
 const tune=sealedAt!==0?victory:ambient;if(!muted&&tune.paused)tune.play().catch(()=>{});}
function tone(f,dur,v=.04,type='sine',when=0,slide=0){if(!audio||muted)return;const t=audio.currentTime+when,o=audio.createOscillator(),g=audio.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.02);}
let noiseBuf=null;
function noise(dur,v,freq,q=1,type='bandpass',when=0){if(!audio||muted)return;
 if(!noiseBuf){noiseBuf=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 const t=audio.currentTime+when,s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=noiseBuf;s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(audio.destination);s.start(t,Math.random());s.stop(t+dur+.05);}
const sfx={
 step(){noise(.05,.02,900,1.2);},
 bump(){tone(84,.11,.05,'triangle');},
 scrape(){noise(.24,.09,260,.9);noise(.2,.03,1400,2);},                        // wood dragged over stone
 seal(){tone(98,.5,.09,'sine');tone(392,.6,.03,'triangle',.03);noise(.12,.06,180,.8);},
 vault(){noise(1.5,.13,90,.7,'lowpass');for(let i=0;i<9;i++)noise(.05,.05,2600,6,'bandpass',.12+i*.13);tone(55,1.4,.07,'sine',0,.8);},
 key(){[1760,2637,3520,5274].forEach((f,i)=>tone(f,1.1-i*.15,.05/(i+1),'sine',i*.035));tone(2217,.9,.02,'triangle',.11);noise(.03,.05,6000,3);}, // bright metallic chime
 unlock(){noise(.04,.1,3200,4);noise(.05,.09,1800,3,'bandpass',.13);tone(140,.25,.05,'square',.2,.6);noise(.7,.07,420,1.5,'bandpass',.3);}
};

// ---- rules ----------------------------------------------------------------------------------
function checkSeals(){if(sealed()||!GOALS.every(([x,y])=>crateAt(x,y)!==-1))return;
 sealedAt=performance.now();sfx.vault();ambient.pause();if(!muted){victory.currentTime=0;victory.play().catch(()=>{});}
 message('Všechny pečetě zapadly. Dole pod plošinou se s rachotem zvedá mříž.',5200);}
function makeMove(dx,dy){
 if(finished||tween||exitWalk)return false;
 const to=stepTo(actor[0],actor[1],dx,dy);if(!to)return false;
 const [nx,ny]=to,through=Math.abs(nx-actor[0])+Math.abs(ny-actor[1])!==1,bi=crateAt(nx,ny);let boxMove=null;
 if(bi!==-1){if(through||!canStep(nx,ny,dx,dy)||heroOnly(nx+dx,ny+dy)||crateAt(nx+dx,ny+dy)!==-1)return false;boxMove={i:bi,from:[nx,ny],to:[nx+dx,ny+dy]};}
 history.push({actor:[...actor],crates:crates.map(p=>[...p]),moves,pushes});if(history.length>900)history.shift();
 const prev=[...actor];actor=[nx,ny];moves++;
 if(boxMove){crates[bi]=boxMove.to;pushes++;sfx.scrape();if(GOALS.some(g=>g[0]===boxMove.to[0]&&g[1]===boxMove.to[1]))setTimeout(sfx.seal,170);}else sfx.step();
 const sdx=cen(nx,ny).x-cen(...prev).x;if(Math.abs(sdx)>2&&!through)facing=sdx>0?'walk_right':'walk_left';
 tween={from:prev,to:[...actor],boxMove,through,started:performance.now(),duration:through?760:boxMove?240:150};
 if(through){sfx.step();setTimeout(sfx.step,260);setTimeout(sfx.step,520);}
 checkSeals();save();return true;
}
const at=(p,q)=>p[0]===q[0]&&p[1]===q[1];
function arrived(){                                           // called when a step has finished
 if(pending.length)return;
 if(at(actor,KEY_CELL)&&!hasKey){hasKey=true;invEl.classList.add('has');sfx.key();save();message('Mosazný klíč. Je studený a těžký — tenhle bude patřit k portálu nahoře.',4800);}
 if(at(actor,PORTAL)){
  if(!hasKey){sfx.bump();message('Portál je zamčený. Bez klíče jím neprojdu.',4200);}
  else{hasKey=false;invEl.classList.remove('has');sfx.unlock();message('Klíč zapadl do zámku. Portál se otevírá…',3600);
   const a=cen(...actor);setTimeout(()=>{exitWalk={from:[a.x,a.y],to:[958,184],started:performance.now(),duration:900};facing='walk_right';},650);}}
}
function undo(){if(!history.length||finished||exitWalk)return;pending=[];tween=null;const a=history.pop();actor=a.actor;crates=a.crates;moves=a.moves;pushes=a.pushes;tone(180,.12,.035,'triangle');save();}
function restart(){reset();victory.pause();victory.currentTime=0;wake();tone(220,.12,.04,'triangle');tone(165,.18,.04,'triangle',.09);save();message('Bedny i mříže jsou zpátky na svých místech.');}
function walkTo(to){
 if(!isFloor(...to)||crateAt(...to)!==-1)return null;
 const src=k(...actor),dst=k(...to),q=[[...actor]],via=new Map([[src,null]]);
 for(let j=0;j<q.length;j++){const [x,y]=q[j];if(k(x,y)===dst)break;
  for(const [dx,dy] of DELTAS){const t=stepTo(x,y,dx,dy);if(!t)continue;const z=k(...t);if(crateAt(...t)!==-1||via.has(z))continue;via.set(z,{from:k(x,y),delta:[dx,dy]});q.push(t);}}
 if(!via.has(dst))return null;const a=[];let p=dst;while(p!==src){const f=via.get(p);a.unshift(f.delta);p=f.from;}return a;
}
// A key names one of the four paving directions. Where the walkway outside bends away from the paving
// lattice, the key that points along it on screen works as well.
const KEYDIR=d=>DELTAS.find(e=>(e[1]-e[0])*HW===d[0]&&(e[0]+e[1])*HH===d[1]);
function keyStep(vx,vy,from){const nominal=KEYDIR([vx,vy]);if(nominal&&stepTo(from[0],from[1],nominal[0],nominal[1]))return nominal;
 let best=null,bc=.85;const p=cen(...from),vl=Math.hypot(vx,vy);
 for(const d of DELTAS){const t=stepTo(from[0],from[1],d[0],d[1]);if(!t||Math.abs(t[0]-from[0])+Math.abs(t[1]-from[1])!==1)continue;const q=cen(...t),ex=q.x-p.x,ey=q.y-p.y;
  const c=(ex*vx+ey*vy)/(Math.hypot(ex,ey)*vl);if(c>bc){bc=c;best=d;}}
 return best;}
let keyAt=null;
function queue(vx,vy){if(finished||exitWalk)return;wake();
 if(!tween&&!pending.length){keyAt=[...actor];const d=keyStep(vx,vy,actor);if(!d||!makeMove(...d))sfx.bump();else keyAt=stepTo(keyAt[0],keyAt[1],d[0],d[1]);return;}
 if(pending.length<4&&keyAt){const d=keyStep(vx,vy,keyAt);if(d){pending.push(d);keyAt=stepTo(keyAt[0],keyAt[1],d[0],d[1]);}}}
function go(to,why){if(at(actor,to)){arrived();return;}const route=walkTo(to);if(route)pending=route;else message(why);}
function cellAt(sx,sy){let best=null,bd=1.15;for(const key of floor){const [x,y]=key.split(',').map(Number),p=cen(x,y),d=Math.abs(sx-p.x)/HW+Math.abs(sy-p.y)/HH;if(d<bd){bd=d;best=[x,y];}}return best;}
function onClick(ev){if(finished||exitWalk)return;wake();keyAt=null;
 const r=canvas.getBoundingClientRect(),sx=(ev.clientX-r.left)/r.width*1085,sy=(ev.clientY-r.top)/r.height*566;
 if(sx>=905&&sx<=1005&&sy>=70&&sy<=232){go(PORTAL,'K portálu se teď nedostanu.');return;}       // the east arch
 const low=cellAt(sx,sy),toLow=ctx.isPointInPath(vaultPath,sx,sy)?GATE_LOW:(low&&low[0]>=13?low:null);            // the barred gate and the low ground beyond it
 if(toLow){if(!sealed())message('Zamřížovaný průchod pod plošinou je zavřený. Za ním se na zemi leskne klíč.',4200);else go(toLow,'K mříži se teď nedostanu.');return;}
 // crates first (their sprites stand taller than the tile), front-most wins
 let best=-1,bd=-1;for(let i=0;i<crates.length;i++){const p=cen(...crates[i]);if(sx>p.x-28&&sx<p.x+28&&sy>p.y-50&&sy<p.y+19&&crates[i][0]+crates[i][1]>bd){bd=crates[i][0]+crates[i][1];best=i;}}
 if(best>=0){const b=crates[best],dx=b[0]-actor[0],dy=b[1]-actor[1];
  if(Math.abs(dx)+Math.abs(dy)===1&&canStep(actor[0],actor[1],dx,dy)){pending=[[dx,dy]];return;}   // standing next to it: push it away
  let route=null;for(const [ex,ey] of DELTAS){if(!canStep(b[0]+ex,b[1]+ey,-ex,-ey))continue;const r2=walkTo([b[0]+ex,b[1]+ey]);if(r2&&(!route||r2.length<route.length))route=r2;}
  if(route)pending=route;else message('K té bedně se odsud nedostanu.');return;}
 const c=cellAt(sx,sy);if(!c)return;const route=walkTo(c);if(route)pending=route;
}
canvas.addEventListener('pointerdown',onClick);
document.addEventListener('keydown',ev=>{
 const keys={ArrowRight:[HW,HH],ArrowLeft:[-HW,-HH],ArrowUp:[HW,-HH],ArrowDown:[-HW,HH],d:[HW,HH],a:[-HW,-HH],w:[HW,-HH],s:[-HW,HH]};const key=ev.key.length===1?ev.key.toLowerCase():ev.key;
 if(keys[key]){ev.preventDefault();queue(...keys[key]);}
 else if(key==='z'||key==='Backspace'){ev.preventDefault();undo();}
 else if(key==='r'){ev.preventDefault();restart();}
 else if(key==='m'){muted=!muted;ambient.muted=victory.muted=muted;}
});
document.querySelector('#restart').onclick=restart;
// TEMPORARY testing aid: drops every crate onto a seal. Remove this handler and the #solve button when done.
document.querySelector('#solve').onclick=()=>{if(finished||exitWalk)return;wake();pending=[];tween=null;crates=GOALS.map(p=>[...p]);
 if(crateAt(...actor)!==-1)actor=[...START];checkSeals();save();};

// ---- drawing --------------------------------------------------------------------------------
const vaultPath=new Path2D();VAULT.forEach((p,i)=>i?vaultPath.lineTo(p[0],p[1]):vaultPath.moveTo(p[0],p[1]));vaultPath.closePath();
const ease=t=>t*t*(3-2*t);
function drawKeyOnFloor(c,now){if(!ready(keyImg))return;const [x,y]=KEY_POS,h=20,w=h*keyImg.naturalWidth/keyImg.naturalHeight,tw=.5+.5*Math.sin(now/260);
 const g=c.createRadialGradient(x,y,1,x,y,13);g.addColorStop(0,`rgba(255,206,110,${.3+.2*tw})`);g.addColorStop(1,'rgba(255,190,90,0)');c.fillStyle=g;c.fillRect(x-14,y-14,28,28);
 c.save();c.translate(x,y);c.rotate(1.35);c.drawImage(keyImg,-w/2,-h/2,w,h);c.restore();
 if(tw>.8){c.fillStyle='#fff6d0';c.fillRect(x+3,y-5,1,5);c.fillRect(x+1,y-3,5,1);}}
function paintScene(now){                                     // the painting, the key on the low ground, the gate's grate
 if(ready(bg))sctx.drawImage(bg,0,0,1085,566);else{sctx.fillStyle='#1b1519';sctx.fillRect(0,0,1085,566);}
 if(!ready(bg))return;
 if(!hasKey&&!finished)drawKeyOnFloor(sctx,now);
 if(!sealed())return;
 const p=Math.min(1,(now-sealedAt)/1300),e=ease(p);
 sctx.save();sctx.clip(vaultPath);sctx.fillStyle='#050304';sctx.fillRect(440,430,90,120);
 const g=sctx.createRadialGradient(484,516,2,484,516,44);g.addColorStop(0,`rgba(255,160,64,${.2*e})`);g.addColorStop(1,'rgba(255,150,60,0)');sctx.fillStyle=g;sctx.fillRect(440,430,90,120);
 if(p<1)sctx.drawImage(bg,440,430,90,120,440,430-e*96,90,120);
 sctx.restore();
}
function occlude(lx,ly,bx,by,bw,bh){                          // redraw every wall that stands in front of lattice point (lx,ly)
 for(const w of WALLS){if(lx>=w.box[1]-.001||ly>=w.box[3]-.001)continue;
  if(bx>w.x1||bx+bw<w.x0||by>w.y1||by+bh<w.y0)continue;
  ctx.save();ctx.beginPath();ctx.rect(bx,by,bw,bh);ctx.clip();ctx.clip(w.path);ctx.drawImage(scene,0,0);ctx.restore();}
}
function diamond(x,y,hw,hh){ctx.beginPath();ctx.moveTo(x,y-hh);ctx.lineTo(x+hw,y);ctx.lineTo(x,y+hh);ctx.lineTo(x-hw,y);ctx.closePath();}
function drawSeal(gx,gy,now){const p=cen(gx,gy),on=crateAt(gx,gy)!==-1,pulse=.5+.5*Math.sin(now/520+gx*1.7+gy);
 ctx.save();ctx.lineJoin='miter';
 ctx.globalAlpha=on?.95:.5+.22*pulse;ctx.strokeStyle=on?'#ffd27a':'#b98a48';ctx.lineWidth=2;diamond(p.x,p.y,29,14.8);ctx.stroke();
 ctx.globalAlpha*=.8;ctx.lineWidth=1;diamond(p.x,p.y,21,10.7);ctx.stroke();
 ctx.fillStyle=on?'#ffd27a':'#b98a48';for(const [ax,ay] of [[0,-6],[11,0],[0,6],[-11,0],[0,0]])ctx.fillRect(Math.round(p.x+ax)-1,Math.round(p.y+ay)-1,2,2);
 if(on){ctx.globalAlpha=.16;ctx.fillStyle='#ffc060';diamond(p.x,p.y,29,14.8);ctx.fill();}
 ctx.restore();occlude(p.lc,p.lr,p.x-31,p.y-17,62,34);
}
function frame(now){
 // --- advance animations
 let hp=cen(...actor),lx=hp.lc,ly=hp.lr,walking=false,alpha=1;
 if(tween){const t=Math.min(1,(now-tween.started)/tween.duration),u=tween.boxMove?t:ease(t)*.4+t*.6,a=cen(...tween.from),b=cen(...tween.to);
  hp={x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u};lx=a.lc+(b.lc-a.lc)*u;ly=a.lr+(b.lr-a.lr)*u;walking=true;
  if(tween.through){const first=t<.5;hp=first?a:b;lx=hp.lc;ly=hp.lr;alpha=Math.abs(1-2*t);walking=false;}
  if(t>=1){tween=null;hp=cen(...actor);lx=hp.lc;ly=hp.lr;if(!pending.length)walking=false;arrived();}}
 if(exitWalk){const u=Math.min(1,(now-exitWalk.started)/exitWalk.duration);hp={x:exitWalk.from[0]+(exitWalk.to[0]-exitWalk.from[0])*u,y:exitWalk.from[1]+(exitWalk.to[1]-exitWalk.from[1])*u};walking=true;alpha=1-u;
  if(u>=1&&!finished){finished=true;ending.classList.add('show');save();}}
 // --- scene
 paintScene(now);ctx.drawImage(scene,0,0);
 for(const [gx,gy] of GOALS)drawSeal(gx,gy,now);
 // --- everything that stands on the floor, back to front
 const objs=[];
 for(let i=0;i<crates.length;i++){let p=cen(...crates[i]),cl=p.lc,cr=p.lr;
  if(tween?.boxMove?.i===i){const a=tween.boxMove,t=Math.min(1,(now-tween.started)/tween.duration),pa=cen(...a.from),pb=cen(...a.to);p={x:pa.x+(pb.x-pa.x)*t,y:pa.y+(pb.y-pa.y)*t};cl=pa.lc+(pb.lc-pa.lc)*t;cr=pa.lr+(pb.lr-pa.lr)*t;}
  objs.push({type:'crate',p,lx:cl,ly:cr,depth:cl+cr});}
 if(!finished)objs.push({type:'hero',p:hp,lx,ly,depth:lx+ly+.05});
 objs.sort((a,b)=>a.depth-b.depth);
 for(const o of objs){const p=o.p;
  if(o.type==='crate'){
   ctx.fillStyle='rgba(0,0,0,.28)';diamond(p.x+3,p.y+2,34,17.5);ctx.fill();ctx.fillStyle='rgba(0,0,0,.34)';diamond(p.x+1,p.y+1,30,15.5);ctx.fill();
   if(ready(crateImg))ctx.drawImage(crateImg,p.x-27.6,p.y-49.6,55.2,68);
   occlude(o.lx,o.ly,p.x-38,p.y-52,76,74);
  }else{
   ctx.save();ctx.globalAlpha=alpha;
   ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(p.x,p.y+3,15,6.5,0,0,Math.PI*2);ctx.fill();
   const im=walking?heroFrames[facing+(Math.floor(now/110)%10)]:heroFrames.idle,h=78;
   if(ready(im)){const w=h*im.naturalWidth/im.naturalHeight;ctx.drawImage(im,p.x-w/2,p.y+5-h*.991,w,h);}
   ctx.restore();occlude(o.lx,o.ly,p.x-34,p.y-78,68,90);
  }
 }
 if(!tween&&pending.length&&!finished&&!exitWalk){const next=pending.shift();if(!makeMove(...next)){pending=[];sfx.bump();}}
 requestAnimationFrame(frame);
}
window.__cellar={get state(){return {actor:[...actor],crates:crates.map(p=>[...p]),moves,pushes,sealed:sealed(),hasKey,finished};}};
if(location.hash==='#debug')window.__cellar.place=(a,c)=>{actor=a;if(c)crates=c;tween=null;pending=[];};
restore();requestAnimationFrame(frame);
})();
</script></body></html>
