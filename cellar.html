<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darkness — Kamenné podzemí</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050409;color:#cfad7e}
body{display:flex;align-items:center;justify-content:center;font-family:VT323,monospace}
#shell{width:min(1200px,100vw)}#scene{position:relative;aspect-ratio:1085/566;width:100%;background:#090b12;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:url("assets/cursors/walk.png") 6 10,pointer;touch-action:none}
#message{position:absolute;left:15%;right:15%;bottom:5%;background:rgba(4,5,8,.92);border:1px solid #725b41;color:#ebd1a2;text-align:center;padding:10px 20px;font-size:clamp(16px,2.3vw,28px);opacity:0;pointer-events:none;transition:opacity .35s;text-shadow:1px 1px #000}
#message.on{opacity:1}#toolbar{background:#08070a;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:9px 13px}
#toolbar button,#touch button{font:22px VT323,monospace;background:#211b1c;color:#d6bd90;border:1px solid #73593d;cursor:pointer;min-width:46px;min-height:36px}
#toolbar button:hover,#touch button:hover{background:#463326}#count{font-size:22px}#touch{display:flex;gap:4px}
#help{color:#8c7966;line-height:1.3;text-align:center;padding:4px 0 10px;font-size:20px}
@media(max-width:660px){#toolbar{justify-content:center}#count{width:100%;text-align:center}#touch button{min-width:38px;min-height:39px}#message{left:4%;right:4%;bottom:10%;}}
</style>
</head><body>
<div id="shell"><div id="scene"><canvas id="game" width="1085" height="566" aria-label="Kamenné podzemí: Sokoban s pěti kamennými bloky"></canvas><div id="message" aria-live="polite"></div></div>
<div id="toolbar"><div id="count">KROKY: <span id="moves">0</span>　 TLAČENÍ: <span id="pushes">0</span>　 PEČETĚ: <span id="solved">0/5</span></div>
<div id="touch"><button data-move="0,-1" title="Nahoru">↑</button><button data-move="-1,0" title="Vlevo">←</button><button data-move="0,1" title="Dolů">↓</button><button data-move="1,0" title="Vpravo">→</button></div>
<div><button id="undo" title="Vrátit poslední tah">↶ Z</button> <button id="reset" title="Zkusit znovu">↺ R</button> <button id="mute" title="Hudba">♪</button> <button id="back" title="Zpět do kobky">↰</button></div></div>
<div id="help">TLAČ KAMENNÉ BLOKY NA STARÉ PEČETĚ · ŠIPKY / WASD · Z = ZPĚT · R = RESTART · KLIKNUTÍM SE PŘESUŇ</div>
<audio id="ambient" src="assets/music/before_the_light_soft_soundblaster.ogg" loop preload="none"></audio></div>
<script>
(function(){
"use strict";
const raw=[
"#################",
"#...#...........#",
"#.$.#.#..#$.$.#.#",
"#....o.#....#..o#",
"###.#....##.....#",
"#...o#.o........#",
"#..$##.#.#..#...#",
"#..........@$...#",
"#.#.......##....#",
"#..............o#",
"#################"
];
const W=17,H=11,T=42,OX=186,OY=59,exit=[15,1],saveKey="darkness-cellar-puzzle-v1";
const cvs=document.querySelector("#game"),g=cvs.getContext("2d"),base=document.createElement("canvas");
base.width=1085;base.height=566;const b=base.getContext("2d");
const movesEl=document.querySelector("#moves"),pushEl=document.querySelector("#pushes"),solvedEl=document.querySelector("#solved");
const msg=document.querySelector("#message"),music=document.querySelector("#ambient");music.volume=.20;
let ctxAudio=null,muted=false,steps=0,pushes=0,complete=false,escaped=false,undo=[],messageTimer=0;
let walls=new Set(),goals=new Set(),boxes=new Set(),player=[0,0],entryPlayer=[0,0],initialBoxes=[];
const K=(x,y)=>x+","+y, P=s=>s.split(",").map(Number);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
 const c=raw[y][x],k=K(x,y);
 if(c==="#")walls.add(k);if(c==="o"||c==="+")goals.add(k);
 if(c==="$"||c==="+")boxes.add(k);
 if(c==="@"){player=[x,y];entryPlayer=[x,y];}
}
initialBoxes=Array.from(boxes);
function hashed(x,y,s=0){let n=(x*374761393+y*668265263+s*1442695041)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295;}
function col(a){return "rgb("+a.join(",")+")";}
function say(t,delay=3900){msg.textContent=t;msg.classList.add("on");clearTimeout(messageTimer);messageTimer=setTimeout(()=>msg.classList.remove("on"),delay);}
function note(n,d=.18,vol=.07,type="triangle"){if(!ctxAudio||muted)return;const t=ctxAudio.currentTime,o=ctxAudio.createOscillator(),v=ctxAudio.createGain();o.type=type;o.frequency.value=n;v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(ctxAudio.destination);o.start(t);o.stop(t+d);}
function audioStart(){if(!ctxAudio)try{ctxAudio=new(window.AudioContext||window.webkitAudioContext)();}catch(e){};if(!muted&&music.paused)music.play().catch(()=>{});}
function updateCounters(){movesEl.textContent=steps;pushEl.textContent=pushes;solvedEl.textContent=Array.from(boxes).filter(q=>goals.has(q)).length+"/"+goals.size;}
function store(){try{localStorage.setItem(saveKey,JSON.stringify({p:player,box:Array.from(boxes),steps,pushes,complete,escaped}));}catch(e){}}
function load(){try{let a=JSON.parse(localStorage.getItem(saveKey));if(a&&Array.isArray(a.p)&&a.box.length===5&&a.box.every(q=>typeof q==="string"&&!walls.has(q))){player=a.p;boxes=new Set(a.box);steps=a.steps|0;pushes=a.pushes|0;complete=goals.size===Array.from(boxes).filter(q=>goals.has(q)).length;escaped=!!a.escaped;}}catch(e){}}
function record(){undo.push({p:player.slice(),box:Array.from(boxes),steps,pushes,complete,escaped});if(undo.length>500)undo.shift();}
function undoMove(){if(!undo.length)return;let a=undo.pop();player=a.p;boxes=new Set(a.box);steps=a.steps;pushes=a.pushes;complete=a.complete;escaped=a.escaped;updateCounters();store();note(170);}
function reset(){boxes=new Set(initialBoxes);player=entryPlayer.slice();steps=0;pushes=0;undo=[];complete=false;escaped=false;updateCounters();store();say("Kamenné bloky se vrátily na svá místa.");}
function legal(x,y){return x>=0&&y>=0&&x<W&&y<H&&!walls.has(K(x,y));}
function move(dx,dy){if(escaped||(!dx&&!dy))return false;const nx=player[0]+dx,ny=player[1]+dy,k=K(nx,ny);
 if(!legal(nx,ny))return false;
 let isBox=boxes.has(k);
 if(isBox){const tx=nx+dx,ty=ny+dy,to=K(tx,ty);
  if(!legal(tx,ty)||boxes.has(to))return false;
  record();boxes.delete(k);boxes.add(to);pushes++;note(78,.29,.12,"sawtooth");setTimeout(()=>note(48,.18,.06),90);
 }else{record();note(115,.06,.024);}
 player=[nx,ny];steps++;
 const was=complete;complete=Array.from(boxes).every(q=>goals.has(q));
 if(complete&&!was){say("Všechny kamenné bloky zapadly do pečetí. Na severu se odemkla stará brána.",6000);note(329,.7,.12);setTimeout(()=>note(493,.9,.12),230);}
 if(player[0]===exit[0]&&player[1]===exit[1]){
  if(complete){escaped=true;say("BRÁNA POVOLILA. ZA NÍ ČEKÁ DALŠÍ KOMNATA...",10000);note(196,1.6,.16);}
  else say("Kovová brána drží. Staré pečetě musí nejdříve zapadnout.",2600);
 }
 updateCounters();store();return true;
}
function pathTo(target){let start=K(...player),end=K(...target);if(walls.has(end)||boxes.has(end)||start===end)return[];
 const q=[player],prev=new Map([[start,null]]),dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 for(const [x,y] of q){if(K(x,y)===end)break;
  for(const [dx,dy]of dirs){const n=K(x+dx,y+dy);if(!walls.has(n)&&!boxes.has(n)&&!prev.has(n)){prev.set(n,[K(x,y),dx,dy]);q.push([x+dx,y+dy]);}}
 }
 if(!prev.has(end))return[];let route=[],at=end;
 while(at!==start){let [before,dx,dy]=prev.get(at);route.unshift([dx,dy]);at=before;}
 return route;
}
let queued=[],lastAction=0;
function playRoute(){if(!queued.length||escaped)return;const [dx,dy]=queued.shift();move(dx,dy);}
function parseTarget(ev){const r=cvs.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*1085,y=(ev.clientY-r.top)/r.height*566;return [Math.floor((x-OX)/T),Math.floor((y-OY)/T)];}
function clickBoard(ev){audioStart();let [x,y]=parseTarget(ev),k=K(x,y);if(!legal(x,y)){queued=[];return;}
 if(boxes.has(k)){const dx=Math.sign(x-player[0]),dy=Math.sign(y-player[1]);
  if(Math.abs(x-player[0])+Math.abs(y-player[1])===1){queued=[];move(dx,dy);return;}
  say("Obejdi blok a postav se na stranu, ze které ho chceš tlačit.",2500);return;
 }
 queued=pathTo([x,y]);if(queued.length===0)note(92,.12,.05);
}
cvs.addEventListener("pointerdown",clickBoard);
document.querySelectorAll("[data-move]").forEach(btn=>btn.addEventListener("click",()=>{queued=[];audioStart();const [dx,dy]=btn.dataset.move.split(",").map(Number);move(dx,dy);}));
document.addEventListener("keydown",ev=>{const dirs={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]};if(dirs[ev.key]){ev.preventDefault();audioStart();queued=[];move(...dirs[ev.key]);}
 else if(ev.key.toLowerCase()==="z"){queued=[];undoMove();}else if(ev.key.toLowerCase()==="r"){queued=[];reset();}});
document.querySelector("#undo").onclick=()=>{queued=[];undoMove();};
document.querySelector("#reset").onclick=()=>{queued=[];reset();};
document.querySelector("#mute").onclick=()=>{muted=!muted;music.muted=muted;audioStart();document.querySelector("#mute").textContent=muted?"♪̸":"♪";};
document.querySelector("#back").onclick=()=>{location.href="index.html";};
function line(c,x1,y1,x2,y2,color,w=1){c.strokeStyle=color;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function drawFloor(c,x,y,tx,ty){
 const n=hashed(tx,ty),v=13+Math.floor(n*9);c.fillStyle=col([v+11,v+9,v+10]);c.fillRect(x,y,T,T);
 c.fillStyle="rgba(2,5,8,.32)";c.fillRect(x+1,y+1,T-2,T-2);
 c.fillStyle="rgba(79,99,109,.12)";c.fillRect(x+3,y+3,T-7,2);
 line(c,x+2,y+T-2,x+T-2,y+T-2,"rgba(0,0,0,.52)",2);line(c,x+T-2,y+2,x+T-2,y+T-2,"rgba(0,0,0,.48)",2);
 for(let k=0;k<19;k++){const px=x+4+hashed(tx*17+k,ty+23)*34,py=y+4+hashed(tx+11,ty*13+k)*33;const r=hashed(tx*3,ty*17,k);c.fillStyle=r<.60?"rgba(145,123,98,.08)":"rgba(23,37,46,.40)";c.fillRect(px|0,py|0,1+(r>.87?2:0),1);}
 if(n>.67){line(c,x+9,y+10,x+15,y+16,"rgba(80,88,93,.23)");line(c,x+15,y+16,x+14,y+27,"rgba(80,88,93,.23)");}
 if(n<.27){c.fillStyle="rgba(30,65,49,.28)";c.fillRect(x+6,y+T-7,6,2);c.fillRect(x+13,y+T-6,4,2);}
}
function drawWall(c,x,y,tx,ty){
 const n=hashed(tx,ty),v=29+(n*17|0);
 c.fillStyle=col([v+11,v+4,v+5]);c.fillRect(x,y,T,T);
 c.fillStyle="#19191f";c.fillRect(x+2,y+4,T-4,T-6);
 c.fillStyle=col([v+20,v+10,v+4]);c.fillRect(x+2,y+2,T-4,5);
 c.fillStyle="rgba(155,128,100,.21)";c.fillRect(x+4,y+4,T-9,2);
 c.fillStyle="#070a0e";c.fillRect(x+T-5,y+4,4,T-4);c.fillRect(x+3,y+T-6,T-7,4);
 for(let k=0;k<16;k++){const px=x+(hashed(tx*11+k,ty)*34|0)+4,py=y+(hashed(tx,ty*7+k)*28|0)+7;c.fillStyle=k%3?"rgba(0,0,0,.22)":"rgba(176,128,91,.10)";c.fillRect(px,py,(k%4)+1,(k%3)+1);}
 if(n>.62){line(c,x+14,y+8,x+19,y+17,"rgba(2,4,7,.65)");line(c,x+19,y+17,x+16,y+27,"rgba(2,4,7,.65)");}
 if(n<.3){c.fillStyle="#273529";c.fillRect(x+4,y+T-12,8,3);c.fillRect(x+12,y+T-10,4,2);}
}
function drawGoal(c,x,y,on){
 c.save();c.translate(x+T/2,y+T/2);c.strokeStyle=on?"#b7bb84":"#8d6e50";c.globalAlpha=on?.95:.58;c.lineWidth=2;
 c.beginPath();c.arc(0,0,14,0,Math.PI*2);c.stroke();
 c.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;const xx=Math.cos(a)*11,yy=Math.sin(a)*11;if(!i)c.moveTo(xx,yy);else c.lineTo(xx,yy);}c.closePath();c.stroke();
 c.beginPath();c.moveTo(-13,0);c.lineTo(13,0);c.moveTo(0,-13);c.lineTo(0,13);c.stroke();c.restore();
}
function createBackdrop(){
 const c=b;c.fillStyle="#07080e";c.fillRect(0,0,1085,566);
 const rad=c.createRadialGradient(605,220,45,540,255,600);rad.addColorStop(0,"#23202a");rad.addColorStop(.55,"#121018");rad.addColorStop(1,"#050509");c.fillStyle=rad;c.fillRect(0,0,1085,566);
 // The cellar is cut into thick ancient masonry rather than a clean game grid.
 for(let y=0;y<566;y+=39)for(let x=0;x<1085;x+=61){const n=hashed(x,y);c.fillStyle=n>.68?"rgba(81,59,52,.13)":"rgba(44,45,51,.17)";c.fillRect(x+(y%2)*10,y,58,35);line(c,x,y+36,x+59,y+36,"rgba(0,0,0,.48)",3);}
 const glow=c.createRadialGradient(130,74,1,130,74,340);glow.addColorStop(0,"rgba(183,94,40,.33)");glow.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=glow;c.fillRect(0,0,700,540);
 const blue=c.createRadialGradient(890,66,5,890,66,410);blue.addColorStop(0,"rgba(54,90,112,.19)");blue.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=blue;c.fillRect(410,0,675,520);
 // Heavy hanging chains and fragments of broken statues at the margins.
 for(const xx of [103,966]){for(let y=0;y<385;y+=15){c.strokeStyle="#3f3938";c.lineWidth=4;c.beginPath();c.ellipse(xx+Math.sin(y/22)*4,y,6,10,-.3,0,Math.PI*2);c.stroke();}}
 c.font="21px 'VT323',monospace";c.textAlign="center";c.fillStyle="#ae885c";c.fillText("ZAPOMENUTÉ SKLEPY",542,28);
 c.font="17px 'VT323',monospace";c.fillStyle="#756c67";c.fillText("PODZEMNÍ CHODBY • PĚT KAMENNÝCH PEČETÍ",542,46);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const xx=OX+x*T,yy=OY+y*T;
  if(walls.has(K(x,y)))drawWall(c,xx,yy,x,y);else drawFloor(c,xx,yy,x,y);
 }
 for(const k of goals){let [x,y]=P(k);drawGoal(c,OX+x*T,OY+y*T,false);}
 // Stone jamb and pitch-black barred exit at the northern end of the labyrinth.
 c.fillStyle="rgba(0,0,0,.52)";c.fillRect(OX+14*T,OY-5,2*T+4,12);
 c.fillStyle="#98704c";c.fillRect(OX+14*T,OY-5,2*T+4,2);
}
function drawCrate(c,x,y,on){
 const X=OX+x*T,Y=OY+y*T;
 c.fillStyle="rgba(0,0,0,.46)";c.fillRect(X+5,Y+34,37,7);
 c.fillStyle="#17181c";c.fillRect(X+4,Y+6,35,33);
 c.fillStyle=on?"#76634d":"#59504b";c.fillRect(X+4,Y+6,32,29);
 c.fillStyle="#a28b6c";c.fillRect(X+4,Y+5,32,4);c.fillRect(X+3,Y+5,4,31);
 c.fillStyle="#242329";c.fillRect(X+32,Y+9,5,28);c.fillRect(X+7,Y+31,30,5);
 c.fillStyle="rgba(0,0,0,.18)";c.fillRect(X+10,Y+12,22,16);
 c.strokeStyle=on?"#c7ae79":"#97836a";c.lineWidth=2;c.strokeRect(X+10,Y+12,18,16);
 c.beginPath();c.moveTo(X+19,Y+13);c.lineTo(X+13,Y+25);c.lineTo(X+25,Y+25);c.closePath();c.stroke();
 for(let t=0;t<7;t++){let a=hashed(x*17+t,y*13),bb=hashed(x+t,y*19);c.fillStyle=t%2?"rgba(20,18,18,.35)":"rgba(197,164,120,.22)";c.fillRect(X+9+a*22,Y+11+bb*20,2,2);}
}
function drawHero(c,x,y,time){
 const X=OX+x*T+21,Y=OY+y*T+22,breath=Math.sin(time/1400)*.55;
 c.save();c.translate(X,Y);
 c.fillStyle="rgba(0,0,0,.55)";c.beginPath();c.ellipse(0,13,16,6,0,0,Math.PI*2);c.fill();
 c.fillStyle="#21171b";c.beginPath();c.moveTo(0,-17);c.lineTo(-11,-9);c.lineTo(-15,11);c.lineTo(0,15);c.lineTo(15,11);c.lineTo(11,-9);c.closePath();c.fill();
 c.fillStyle="#554044";c.beginPath();c.moveTo(0,-16);c.lineTo(-9,-8);c.lineTo(-11,5+breath);c.lineTo(-6,10);c.lineTo(7,10);c.lineTo(12,5+breath);c.lineTo(8,-9);c.closePath();c.fill();
 c.strokeStyle="#8e6660";c.lineWidth=1.5;c.beginPath();c.moveTo(-6,-12);c.lineTo(-10,4);c.moveTo(7,-10);c.lineTo(11,6);c.stroke();
 c.fillStyle="#060507";c.beginPath();c.ellipse(0,-10,7,8,0,0,Math.PI*2);c.fill();
 c.fillStyle="#211c1c";c.fillRect(-3,-7,3,2);
 c.fillStyle="#3a2a28";c.fillRect(-7,11,5,4);c.fillRect(4,11,5,4);
 c.restore();
}
function lantern(c,x,y,t){const f=2+Math.sin(t/120)*1.2,grad=c.createRadialGradient(x,y,0,x,y,65);grad.addColorStop(0,"rgba(252,158,58,.28)");grad.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=grad;c.fillRect(x-65,y-65,130,130);c.fillStyle="#ffbf64";c.beginPath();c.ellipse(x,y,3+f,y?8+f:9,0,0,Math.PI*2);c.fill();c.fillStyle="#574c40";c.fillRect(x-7,y+7,14,6);}
function draw(time){g.clearRect(0,0,1085,566);g.drawImage(base,0,0);
 for(const k of boxes){let [x,y]=P(k);drawCrate(g,x,y,goals.has(k));}
 if(!escaped)drawHero(g,...player,time);
 if(complete){const x=OX+(exit[0]+.5)*T,y=OY+(exit[1]+.5)*T;const rad=g.createRadialGradient(x,y,0,x,y,58);rad.addColorStop(0,"rgba(213,165,88,.27)");rad.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=rad;g.fillRect(x-58,y-58,116,116);g.strokeStyle="#e6bd73";g.lineWidth=3;g.strokeRect(x-14,y-15,28,30);}
 lantern(g,140,135,time);lantern(g,943,397,time+500);
 let vign=g.createRadialGradient(542,270,260,542,270,640);vign.addColorStop(0,"rgba(0,0,0,0)");vign.addColorStop(1,"rgba(0,0,0,.78)");g.fillStyle=vign;g.fillRect(0,0,1085,566);
 if(escaped){g.fillStyle="rgba(0,0,0,.78)";g.fillRect(0,0,1085,566);g.textAlign="center";g.font="36px VT323";g.fillStyle="#e1bb83";g.fillText("TAJNÁ BRÁNA JE OTEVŘENA",542,255);g.font="23px VT323";g.fillStyle="#b3a18e";g.fillText("Někde v hlubinách se ozývá další zámek...",542,291);}
 if(queued.length&&time-lastAction>82){lastAction=time;playRoute();}
 requestAnimationFrame(draw);
}
load();createBackdrop();updateCounters();say("Těžká knihovna skryla vchod do sklepení. Posuň pět kamenných bloků na vyryté pečetě. Špatný tah může chodbu navždy zablokovat.",8500);requestAnimationFrame(draw);
})();
</script></body></html>
