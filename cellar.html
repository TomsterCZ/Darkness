<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darkness — Tajné sklepení</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070507;color:#d8bc93}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
#stage{position:relative;width:min(1200px,100vw);aspect-ratio:1085/566;overflow:hidden;background:#100b11}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:pointer}
#controls{position:absolute;top:12px;right:12px;display:flex;gap:7px;opacity:.64;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}button{border:1px solid #806a50;background:rgba(17,12,13,.82);color:#eed1a0;font:22px Georgia,serif;width:38px;height:38px;border-radius:3px;cursor:pointer}
button:hover{background:#574031}button:focus-visible{outline:2px solid #f3d6a7;outline-offset:2px}
#dpad{display:none;position:absolute;left:10px;bottom:8px;gap:4px}#dpad button{width:43px;height:43px}
#hint{position:absolute;bottom:8%;left:16%;right:16%;text-align:center;color:#f1d8a8;font:clamp(14px,2.4vw,24px) Georgia,serif;text-shadow:1px 2px 5px #000,0 0 9px #000;opacity:0;pointer-events:none;transition:opacity .5s}
#hint.show{opacity:1}
#win{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,rgba(7,16,20,.35),rgba(3,5,8,.87));color:#f0d3a3;text-shadow:0 3px 9px #000;letter-spacing:.12em;font:clamp(19px,3vw,36px) Georgia,serif;pointer-events:none}
#win.show{display:flex}#win small{font:italic clamp(12px,1.6vw,18px) Georgia,serif;letter-spacing:.02em;margin-top:14px;color:#c6b29b}
@media(max-width:760px) and (pointer:coarse){#dpad{display:flex}}
</style></head><body>
<div id="stage"><canvas id="game" width="1085" height="566" aria-label="Isometrická hádanka. Posouvej dřevěné bedny na starobylé kamenné pečetě. Šipky pohyb, Z zpět, R restart."></canvas>
<div id="controls"><button id="back" title="Zpět do kobky" aria-label="Zpět do kobky">↶</button><button id="undo" title="Vrátit tah (Z)" aria-label="Vrátit tah">↰</button><button id="restart" title="Začít znovu (R)" aria-label="Začít znovu">↻</button><button id="mute" title="Přepnout hudbu" aria-label="Přepnout hudbu">♫</button></div>
<div id="dpad"><button data-dx="-1" data-dy="0" aria-label="Severovýchod">↗</button><button data-dx="0" data-dy="1" aria-label="Jihovýchod">↘</button><button data-dx="1" data-dy="0" aria-label="Jihozápad">↙</button><button data-dx="0" data-dy="-1" aria-label="Severozápad">↖</button></div>
<div id="hint" aria-live="polite"></div><div id="win">PRŮCHOD JE OTEVŘENÝ<small>Kamenné pečetě konečně ustoupily...</small></div>
<audio id="ambient" src="assets/music/before_the_light_soft_soundblaster.ogg" loop preload="none"></audio>
<audio id="victory" src="assets/music/whisper_under_stone_soundblaster.ogg" loop preload="none"></audio>
</div>
<script>
(()=>{'use strict';
// The SAME map determines visible stone geometry (baked into the scene asset),
// collisions, crate behavior, target sockets and pathfinding. Keep in sync
// with build_assets.py, which paints the walls and floor from GRID.
const GRID = [
 '######.######',
 '#..#........#',
 '#..#..#.#...#',
 '#.....#.#...#',
 '#..#......#.#',
 '#..#..##....#',
 '#.....#..#..#',
 '.......#....#',
 '#############'
];
const W=13,H=9,HW=36,HH=19,OX=558,OY=99;
// The actual staircase on the left is the entrance; the right-hand arch
// is the exit. Both border cells are open in GRID and visibly paved.
const PLAYER_START=[6,0], EXIT=[0,7];
const CRATES_START=[[5,1],[7,1],[9,2],[10,2],[10,3]];
const GOALS=[[10,2],[11,3],[9,1],[10,1],[11,1]];
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const bg=new Image(),crateImg=new Image();bg.src='assets/scene/cellar_maze_entry_exit_v9.jpg';crateImg.src='assets/props/crate_v8.png';
const heroFrames={};function loadSprite(id,src){let im=new Image();im.src=src;heroFrames[id]=im;}
loadSprite('idle','assets/character/idle/00.png');
for(const dir of ['walk_right','walk_left'])for(let i=0;i<10;i++)loadSprite(dir+i,'assets/character/'+dir+'/'+String(i).padStart(2,'0')+'.png');
const floor=new Set(),walls=new Set(),goals=new Set(GOALS.map(([x,y])=>x+','+y));
const k=(x,y)=>x+','+y,at=(x,y)=>({x:OX+(y-x)*HW,y:OY+(x+y)*HH});
if(GRID.length!==H || GRID.some(row=>row.length!==W))throw Error('Corrupt level dimensions');
for(let y=0;y<H;y++)for(let x=0;x<W;x++)(GRID[y][x]==='#'?walls:floor).add(k(x,y));
if(!floor.has(k(...PLAYER_START))||!floor.has(k(...EXIT))||CRATES_START.length!==5||GOALS.length!==5||GOALS.some(([x,y])=>!floor.has(k(x,y))))throw Error('Invalid crate/exit tile');
const ambient=document.querySelector('#ambient'),victory=document.querySelector('#victory');ambient.volume=.25;victory.volume=.42;
const hint=document.querySelector('#hint'),ending=document.querySelector('#win');let hintTimer=0;
let actor=[...PLAYER_START],crates=CRATES_START.map(p=>[...p]),history=[],pending=[],tween=null,facing='walk_right',finished=false,gateOpen=false, muted=false,hasInteracted=false,audioContext=null,startedVictory=false;
let moves=0,pushes=0;
const DELTAS=[[1,0],[-1,0],[0,1],[0,-1]];
const isFloor=(x,y)=>floor.has(k(x,y));
const crateAt=(x,y)=>crates.findIndex(b=>b[0]===x&&b[1]===y);
function message(s,duration=3100){hint.textContent=s;hint.classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.remove('show'),duration);}
function sound(){hasInteracted=true;
 try{if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume?.();}catch(e){}
 if(!muted&&!gateOpen&&ambient.paused)ambient.play().catch(()=>{});
}
function beep(f=130,time=.1,v=.035,type='triangle'){
 if(!audioContext||muted)return;
 const t=audioContext.currentTime,o=audioContext.createOscillator(),gain=audioContext.createGain();
 o.type=type;o.frequency.value=f;gain.gain.setValueAtTime(v,t);gain.gain.exponentialRampToValueAtTime(.0001,t+time);
 o.connect(gain).connect(audioContext.destination);o.start(t);o.stop(t+time);
}
function saved(){try{localStorage.setItem('darkness_cellar_v9',JSON.stringify({actor,crates,moves,pushes,gateOpen,finished}));}catch(e){}}
function restore(){try{
 const a=JSON.parse(localStorage.getItem('darkness_cellar_v9'));if(!a||!Array.isArray(a.actor)||!Array.isArray(a.crates)||a.crates.length!==5)return;
 if(!isFloor(...a.actor)||a.crates.some(p=>!Array.isArray(p)||!isFloor(...p)))return;
 const set=new Set(a.crates.map(p=>k(...p)));if(set.size!==5||set.has(k(...a.actor)))return;
 actor=[...a.actor];crates=a.crates.map(p=>[...p]);moves=a.moves|0;pushes=a.pushes|0;
 gateOpen=GOALS.every(p=>set.has(k(...p)));finished=gateOpen&&actor[0]===EXIT[0]&&actor[1]===EXIT[1];
 ending.classList.toggle('show',finished);
 }catch(e){}
}
function complete(){gateOpen=true;ambient.pause();victory.currentTime=0; if(!muted)victory.play().catch(()=>{});
 [196,247,294,392,494].forEach((n,i)=>setTimeout(()=>beep(n,.75,.1,'sine'),i*180));
 message('Pět kamenných pečetí zapadlo. Dveře na východě se otevírají...',4800);saved();
}
function makeMove(dx,dy){
 if(finished||tween)return false;
 const nx=actor[0]+dx,ny=actor[1]+dy;
 if(!isFloor(nx,ny))return false;
 const boxIndex=crateAt(nx,ny);let boxMove=null;
 if(boxIndex!==-1){const bx=nx+dx,by=ny+dy;if(!isFloor(bx,by)||crateAt(bx,by)!==-1)return false;
  boxMove={i:boxIndex,from:[...crates[boxIndex]],to:[bx,by]};
 }
 if(nx===EXIT[0]&&ny===EXIT[1]&&!gateOpen){message('Za mříží není průchod. Staré kamenné pečetě ještě nedosedly.');return false;}
 history.push({actor:[...actor],crates:crates.map(p=>[...p]),moves,pushes,gateOpen});if(history.length>700)history.shift();
 const prev=[...actor];actor=[nx,ny];moves++;
 if(boxMove){crates[boxIndex]=boxMove.to;pushes++;beep(74,.26,.08,'sawtooth');}
 else beep(122,.048,.023);
 facing=(dy-dx)>=0?'walk_right':'walk_left';
 tween={from:prev,to:[...actor],boxMove,started:performance.now(),duration:boxMove?210:135};
 if(!gateOpen&&GOALS.every(([x,y])=>crateAt(x,y)!==-1))complete();
 saved();return true;
}
function undo(){if(history.length===0)return;
 pending=[];tween=null;const a=history.pop();actor=a.actor;crates=a.crates;moves=a.moves;pushes=a.pushes;
 gateOpen=a.gateOpen;finished=false;ending.classList.remove('show');victory.pause();victory.currentTime=0;
 if(hasInteracted&&!muted&&!gateOpen)ambient.play().catch(()=>{});beep(180,.13,.04);saved();
}
function restart(){pending=[];tween=null;history=[];actor=[...PLAYER_START];crates=CRATES_START.map(p=>[...p]);moves=0;pushes=0;gateOpen=false;finished=false;
 ending.classList.remove('show');victory.pause();victory.currentTime=0;
 if(hasInteracted&&!muted){ambient.currentTime=0;ambient.play().catch(()=>{});}saved();message('Kamenné bloky se vrátily na své místo.');
}
function shortestWalk(to){
 if(!isFloor(...to)||crateAt(...to)!==-1)return null;
 const src=k(...actor),dst=k(...to),q=[[...actor]],via=new Map([[src,null]]);
 for(let j=0;j<q.length;j++){
  const [x,y]=q[j];if(k(x,y)===dst)break;
  for(const [dx,dy] of DELTAS){const tx=x+dx,ty=y+dy,z=k(tx,ty);
   if(!isFloor(tx,ty)||crateAt(tx,ty)!==-1||via.has(z)||(!gateOpen&&tx===EXIT[0]&&ty===EXIT[1]))continue;
   via.set(z,{from:k(x,y),delta:[dx,dy]});q.push([tx,ty]);
  }
 }
 if(!via.has(dst))return null;
 const a=[];let p=dst;while(p!==src){const f=via.get(p);a.unshift(f.delta);p=f.from;}return a;
}
function queue(dx,dy){if(finished)return;sound();
 if(tween){if(pending.length<5)pending.push([dx,dy]);}
 else if(pending.length){pending.push([dx,dy]);}
 else {if(!makeMove(dx,dy))beep(91,.10,.03);}
}
function onClick(ev){if(finished)return;sound();
 const r=canvas.getBoundingClientRect(),sx=(ev.clientX-r.left)/r.width*1085,sy=(ev.clientY-r.top)/r.height*566;
 // The illustrated eastern ARCH is the destination. Clicking directly on
 // it is equivalent to clicking the corresponding exit tile on the map.
 if(sx>=925 && sx<=1055 && sy>=147 && sy<=322){
   if(!gateOpen){message('Dveře zatím drží. Nejprve musí zapadnout všech pět pečetí.');return;}
   const route=shortestWalk(EXIT);
   if(route)pending=route;
   return;
 }
 // Actual isometric hit test, including tall crates (their sprites extend above the tile).
 let best=-1,score=Infinity;
 for(let i=0;i<crates.length;i++){const p=at(...crates[i]),dx=(sx-p.x)/30,dy=(sy-(p.y-20))/37;
  if(Math.abs(dx)<1.1&&Math.abs(dy)<1.2&&dx*dx+dy*dy<score){score=dx*dx+dy*dy;best=i;}
 }
 if(best>=0){const b=crates[best];let candidate=null;
  for(const [dx,dy] of DELTAS){const to=[b[0]+dx,b[1]+dy],stand=[b[0]-dx,b[1]-dy];
   if(!isFloor(...to)||crateAt(...to)!==-1)continue;
   const route=shortestWalk(stand);if(route!==null&&(!candidate||route.length<candidate.length))candidate=[...route,[dx,dy]];
  }
  if(candidate){pending=candidate;} else message('Z této strany bednu nelze posunout.');return;
 }
 const u=(sx-OX)/HW,v=(sy-OY)/HH;const x=Math.round((v-u)/2),y=Math.round((v+u)/2);
 if(!isFloor(x,y))return;const p=at(x,y);if(Math.abs(sx-p.x)/HW+Math.abs(sy-p.y)/HH>1.35)return;
 const route=shortestWalk([x,y]);if(route)pending=route;
}
canvas.addEventListener('pointerdown',onClick);
document.addEventListener('keydown',ev=>{
 const keys={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowUp:[-1,0],ArrowDown:[1,0],d:[0,1],a:[0,-1],w:[-1,0],s:[1,0],D:[0,1],A:[0,-1],W:[-1,0],S:[1,0]};
 if(keys[ev.key]){ev.preventDefault();queue(...keys[ev.key]);}
 else if(ev.key.toLowerCase()==='z'){ev.preventDefault();undo();}
 else if(ev.key.toLowerCase()==='r'){ev.preventDefault();restart();}
});
document.querySelectorAll('[data-dx]').forEach(el=>el.addEventListener('click',()=>queue(Number(el.dataset.dx),Number(el.dataset.dy))));
document.querySelector('#undo').onclick=undo;document.querySelector('#restart').onclick=restart;
document.querySelector('#back').onclick=()=>{window.location.href='index.html';};
document.querySelector('#mute').onclick=()=>{muted=!muted;ambient.muted=muted;victory.muted=muted;
 document.querySelector('#mute').style.opacity=muted?'.4':'1';if(!muted){sound();(gateOpen?victory:ambient).play().catch(()=>{});}
};
function frame(now){
 ctx.clearRect(0,0,1085,566);
 if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,1085,566);
 else{ctx.fillStyle='#1b1519';ctx.fillRect(0,0,1085,566);}
 let px=actor[0],py=actor[1],walk=false;
 if(tween){const t=Math.min(1,(now-tween.started)/tween.duration),u=t*t*(3-2*t);
  px=tween.from[0]+(tween.to[0]-tween.from[0])*u;
  py=tween.from[1]+(tween.to[1]-tween.from[1])*u;walk=t<1;
  if(t>=1){tween=null;if(gateOpen&&actor[0]===EXIT[0]&&actor[1]===EXIT[1]&&!finished){finished=true;ending.classList.add('show');saved();}}
 }
 const objs=[];
 for(let i=0;i<crates.length;i++){
  let x=crates[i][0],y=crates[i][1];if(tween?.boxMove?.i===i){const a=tween.boxMove,t=Math.min(1,(now-tween.started)/tween.duration),u=t*t*(3-2*t);
   x=a.from[0]+(a.to[0]-a.from[0])*u;y=a.from[1]+(a.to[1]-a.from[1])*u;
  }objs.push({type:'crate',x,y,depth:x+y+.03});
 }
 if(!finished)objs.push({type:'hero',x:px,y:py,depth:px+py+.12});objs.sort((a,b)=>a.depth-b.depth);
 for(const o of objs){const p=at(o.x,o.y);
  if(o.type==='crate'){
   ctx.fillStyle='rgba(0,0,0,.40)';ctx.beginPath();ctx.ellipse(p.x,p.y+8,27,8,0,0,Math.PI*2);ctx.fill();
   if(crateImg.complete&&crateImg.naturalWidth)ctx.drawImage(crateImg,p.x-31,p.y-57,62,63);
  }else{
   ctx.fillStyle='rgba(0,0,0,.40)';ctx.beginPath();ctx.ellipse(p.x,p.y+7,15,6,0,0,Math.PI*2);ctx.fill();
   const img=walk?heroFrames[facing+(Math.floor(now/155)%10)]:heroFrames.idle;
   if(img?.complete&&img.naturalWidth){const h=76,w=h*img.naturalWidth/img.naturalHeight;ctx.drawImage(img,p.x-w/2,p.y-h+9,w,h);}
   else {ctx.fillStyle='#513b40';ctx.fillRect(p.x-10,p.y-40,20,40);}
  }
 }
 // One rendered exit, shown open only after placing all five crates.
 if(gateOpen&&!finished){const p=at(...EXIT);ctx.fillStyle='rgba(198,138,72,.11)';ctx.beginPath();ctx.ellipse(p.x,p.y-5,33,21,0,0,Math.PI*2);ctx.fill();}
 if(!tween&&pending.length&&!finished){const next=pending.shift();if(!makeMove(...next)){pending=[];beep(91,.1,.035);}}
 requestAnimationFrame(frame);
}
restore();requestAnimationFrame(frame);
})();
</script></body></html>
