<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darkness — Under the Wizard's Cell</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07070b;color:#ddc29d}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
#stage{width:min(1440px,100vw);aspect-ratio:1085/566;position:relative;overflow:hidden;background:#09070a}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:pointer}
#controls{position:absolute;right:1.3%;top:2%;display:flex;gap:7px}
button{background:#100e14ac;color:#cdb188;border:1px solid #8b684e88;border-radius:5px;min-width:35px;aspect-ratio:1;font-size:20px;cursor:pointer}
button:hover{background:#29212a;color:#f9d69e}
#hint{position:absolute;left:15%;right:15%;top:3%;text-align:center;pointer-events:none;color:#ffdfab;font:clamp(13px,1.65vw,21px) Georgia,serif;text-shadow:0 2px 5px #000,0 0 12px #000;opacity:0;transition:opacity .2s}
#hint.show{opacity:1}
#ending{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse,rgba(12,12,19,.75),rgba(4,5,7,.95));color:#edc98d;text-shadow:0 4px 8px black;text-align:center;font-size:clamp(20px,3vw,39px)}
#ending.show{display:flex}#ending small{margin-top:14px;font-size:clamp(11px,1.6vw,18px);color:#bda58d}
</style></head><body>
<div id="stage"><canvas id="game" width="1085" height="566" aria-label="Pixel-art isometric dungeon puzzle"></canvas>
<div id="controls"><button id="undo" aria-label="Undo" title="Undo (Z)">↶</button><button id="restart" aria-label="Restart" title="Restart (R)">⟲</button><button id="sound" aria-label="Sound" title="Sound (M)">♫</button></div>
<div id="hint"></div><div id="ending">THE PASSAGE IS OPEN<small>Beyond the old doorway, another secret awaits.</small></div></div>
<audio id="music" src="assets/music/before_the_light_soft_soundblaster.ogg" preload="none" loop></audio>
<audio id="victory" src="assets/music/whisper_under_stone_soundblaster.ogg" preload="none"></audio>
<script id="cellar-level" type="application/json">
{"version":17,"title":"Beneath the Wizard's Cell",
"tiles":["#############","#...........E","#..##...#...#","#......##...#","#..#........#","#..#...##...#","#...........#","#...#.......#","#...........#","N...........S","############."],
"entry":[11,1],"southLanding":[12,10],"northernGate":[0,9],"southernGate":[12,9],
"crates":[[4,8],[6,7],[8,7],[10,8]],"goals":[[3,7],[5,7],[7,7],[9,7]]}
</script>
<script>
(()=>{
"use strict";
const LEVEL=JSON.parse(document.querySelector("#cellar-level").textContent);
const C=document.querySelector("#game"),g=C.getContext("2d"),W=C.width,H=C.height;
g.imageSmoothingEnabled=false;
const OX=600,OY=30,HW=40,HH=20,WALL_H=36;
const grid=LEVEL.tiles.map(row=>row.split("")),dirs=[[0,1],[0,-1],[-1,0],[1,0]];
const K=(x,y)=>x+","+y,parse=k=>k.split(",").map(Number),on=(x,y)=>grid[y]&&grid[y][x],same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
const P=(x,y)=>({x:OX+(y-x)*HW,y:OY+(x+y)*HH});
const cen=(x,y)=>P(x,y),plus=(p,d)=>[p[0]+d[0],p[1]+d[1]];
const isWall=(x,y)=>!on(x,y)||on(x,y)==="#";
const isGoal=(x,y)=>LEVEL.goals.some(p=>p[0]===x&&p[1]===y);
const images={};function image(id,src){const i=new Image();i.src=src;images[id]=i;return i;}
image("ambient","assets/scene/cellar_ambient.jpg");
// Floor tiles are cropped ONLY from a clean masonry texture atlas, never from a pre-painted maze.
image("stone","assets/scene/cellar_stone_atlas.jpg");
image("crate","assets/props/crate_pixel.png");
image("gate","assets/props/dungeon_gate_atlas.png");
image("idle","assets/character/idle/00.png");
for(const dir of ["walk_right","walk_left"])for(let j=0;j<10;j++)image(dir+j,"assets/character/"+dir+"/"+String(j).padStart(2,"0")+".png");
const ready=im=>im&&im.complete&&im.naturalWidth>0;
const music=document.querySelector("#music"),victory=document.querySelector("#victory");
music.volume=.28;victory.volume=.42;let muted=false,hasAudio=false;
function wake(){
 if(!hasAudio){hasAudio=true;if(!muted)music.play().catch(()=>{});}
}
document.querySelector("#sound").onclick=()=>{muted=!muted;music.muted=victory.muted=muted;wake();};
const hint=document.querySelector("#hint");let hintTimer;
function message(text){hint.textContent=text;hint.classList.add("show");clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.remove("show"),3000);}
let player,crates,moves,pushes,history,tween,queue,solved,southOpenAt,northOpenAt,hasKey,finished,facing,finishFade;
const SAVE="darkness_cellar_tiled_v17";
function reset(){
 player=[...LEVEL.entry];crates=LEVEL.crates.map(p=>[...p]);moves=0;pushes=0;history=[];tween=null;queue=[];solved=false;southOpenAt=0;northOpenAt=0;hasKey=false;finished=false;finishFade=0;facing="walk_right";
 document.querySelector("#ending").classList.remove("show");hint.classList.remove("show");
}
reset();
function snapshot(){return{player:[...player],crates:crates.map(p=>[...p]),moves,pushes,solved,southOpenAt,northOpenAt,hasKey,finished};}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(snapshot()));}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(SAVE));if(!v||!Array.isArray(v.crates)||v.crates.length!==LEVEL.crates.length||v.finished)return;
 if(!v.crates.every(p=>on(...p)&&!isWall(...p))||!on(...v.player)||isWall(...v.player))return;
 player=v.player;crates=v.crates;moves=v.moves|0;pushes=v.pushes|0;solved=!!v.solved;southOpenAt=solved?-1e9:0;hasKey=!!v.hasKey;northOpenAt=v.northOpenAt?-1e9:0;
 }catch(e){}}
load();
function undo(){wake();const v=history.pop();if(!v)return;
 player=v.player;crates=v.crates;moves=v.moves;pushes=v.pushes;solved=v.solved;southOpenAt=v.southOpenAt;hasKey=v.hasKey;northOpenAt=v.northOpenAt;finished=v.finished;queue=[];tween=null;save();}
document.querySelector("#undo").onclick=undo;
document.querySelector("#restart").onclick=()=>{wake();reset();save();};
const atCrate=(x,y)=>crates.findIndex(p=>p[0]===x&&p[1]===y);
const openSouth=()=>solved&&performance.now()-southOpenAt>=1100;
const openNorth=()=>hasKey&&northOpenAt&&performance.now()-northOpenAt>=900;
function enterable(x,y){
 const ch=on(x,y);if(!ch||ch==="#")return false;
 if(ch==="S")return openSouth();
 if(ch==="N")return !!openNorth();
 return true;
}
function step(x,y,dx,dy){
 if(Math.abs(dx)+Math.abs(dy)!==1)return null;
 const nx=x+dx,ny=y+dy;return enterable(nx,ny)?[nx,ny]:null;
}
function playStep(){/* steps are kept quiet against the soft soundtrack */}
function pushSound(){beep(90,.035,.045);}
function beep(freq,delay,duration){
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC||muted)return;
 if(!window.__dungeonAudio)window.__dungeonAudio=new AC();
 const ac=window.__dungeonAudio,osc=ac.createOscillator(),vol=ac.createGain();
 osc.type="triangle";osc.frequency.value=freq;vol.gain.setValueAtTime(.0001,ac.currentTime+delay);
 vol.gain.exponentialRampToValueAtTime(.023,ac.currentTime+delay+.01);
 vol.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+delay+duration);
 osc.connect(vol).connect(ac.destination);osc.start(ac.currentTime+delay);osc.stop(ac.currentTime+delay+duration+.015);
 }catch(e){}
}
function move(dx,dy){
 if(finished||tween)return false;
 const to=step(...player,dx,dy);if(!to){
   const q=plus(player,[dx,dy]);
   if(on(...q)==="N"&&hasKey&&!northOpenAt){northOpenAt=performance.now();beep(175,0,.26);message("An ancient lock yields. The northern door opens.");queue.unshift([dx,dy]);}
   return false;
 }
 const bi=atCrate(...to),after=plus(to,[dx,dy]);let pushing=bi>=0;
 if(pushing&&(on(...after)==="S"||on(...after)==="N"||!step(...to,dx,dy)||atCrate(...after)!==-1))return false;
 history.push(snapshot());if(history.length>600)history.shift();
 const from=[...player];player=to;moves++;
 if(pushing){crates[bi]=after;pushes++;pushSound();}
 const xShift=cen(...to).x-cen(...from).x;
 if(Math.abs(xShift)>1)facing=xShift>0?"walk_right":"walk_left";
 tween={from,to,bi,pushing,crateFrom:to,crateTo:after,start:performance.now(),duration:pushing?230:150};
 if(!solved&&LEVEL.goals.every(q=>atCrate(...q)!==-1)){solved=true;southOpenAt=performance.now();beep(300,.1,.6);message("The stone seals awaken. An iron gate rises to the south.");victory.play().catch(()=>{});}
 if(on(...to)==="."&&same(to,LEVEL.southLanding)&&solved&&!hasKey){hasKey=true;message("Behind the open southern gate you discover an old key.");beep(360,.05,.3);}
 if(on(...to)==="N"&&openNorth()){finished=true;finishFade=performance.now();beep(410,.05,.7);}
 save();return true;
}
function request(dx,dy){wake();if(queue.length>=16)return;
 if(tween||queue.length)queue.push([dx,dy]);else if(!move(dx,dy)){/*blocked*/}}
function path(target){
 if(!on(...target)||isWall(...target))return null;
 const start=K(...player),dst=K(...target),seen=new Map([[start,null]]),q=[player];
 for(let i=0;i<q.length;i++){let p=q[i],k=K(...p);if(k===dst)break;
  for(const d of dirs){const n=step(...p,...d);if(!n||atCrate(...n)>=0||seen.has(K(...n)))continue;seen.set(K(...n),{prev:k,delta:d});q.push(n);}
 }
 if(!seen.has(dst))return null;
 let t=dst,actions=[];while(t!==start){const v=seen.get(t);actions.push(v.delta);t=v.prev;}return actions.reverse();
}
function go(target){wake();const p=path(target);if(p!==null){queue=p;if(p.length===0){const ch=on(...target);if(ch==="N"&&!northOpenAt&&hasKey)northOpenAt=performance.now();}}}
function pointerTile(sx,sy){
 // Resolve only the actual floor diamond, not whichever tile happens
 // to be closest to the pointer. Wall caps are NOT click-through paths.
 let best=null,score=1.0;
 for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++){
  if(isWall(x,y))continue;
  const p=cen(x,y),d=Math.abs(sx-p.x)/HW+Math.abs(sy-p.y)/HH;
  if(d<score){score=d;best=[x,y];}
 }
 return best;
}
C.addEventListener("pointerdown",ev=>{
 if(finished)return;
 const rect=C.getBoundingClientRect(),x=(ev.clientX-rect.left)*W/rect.width,y=(ev.clientY-rect.top)*H/rect.height;
 // Crates occupy pixels above their footprints. Honor their sprite bounds.
 let hit=-1,depth=-999;
 for(let i=0;i<crates.length;i++){const p=cen(...crates[i]),k=crates[i][0]+crates[i][1];
  if(x>p.x-29&&x<p.x+29&&y>p.y-51&&y<p.y+14&&k>depth){hit=i;depth=k;}}
 if(hit>=0){const b=crates[hit],direct=dirs.find(d=>same(plus(player,d),b));
  if(direct){request(...direct);return;}
  let best=null;for(const d of dirs){const behind=[b[0]-d[0],b[1]-d[1]],ahead=plus(b,d);
   if(!on(...ahead)||isWall(...ahead)||atCrate(...ahead)!==-1||!on(...behind))continue;
   const steps=path(behind);if(steps&&(!best||steps.length<best.length))best=[...steps,d];}
  if(best){wake();queue=best;}return;
 }
 const tile=pointerTile(x,y);if(!tile)return;
 if(on(...tile)==="N"&&!hasKey){go([1,9]);message("The northern door is locked.");return;}
 if(on(...tile)==="N"&&hasKey&&!northOpenAt){northOpenAt=performance.now();beep(175,0,.3);}
 if(on(...tile)==="S"&&!solved){message("The southern gate is sealed.");return;}
 go(tile);
});
document.addEventListener("keydown",e=>{
 const d=({ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowUp:[-1,0],ArrowDown:[1,0],d:[0,1],a:[0,-1],w:[-1,0],s:[1,0]})[e.key];
 if(d){e.preventDefault();request(...d);}
 else if(e.key==="z"||e.key==="Backspace"){e.preventDefault();undo();}
 else if(e.key==="r"){reset();save();}
 else if(e.key==="m"){document.querySelector("#sound").click();}
});
function poly(points){g.beginPath();g.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();}
function shade(points,fill,stroke){poly(points);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke();}}
function hash(x,y){let h=((x*92821+y*68917+10727)>>>0);h^=h<<13;h^=h>>>17;h^=h<<5;return h>>>0;}
function tileFloor(x,y){
 const p=cen(x,y),q=[[p.x,p.y-HH],[p.x+HW,p.y],[p.x,p.y+HH],[p.x-HW,p.y]];
 g.save();poly(q);g.clip();
 g.fillStyle=(hash(x,y)%3===0)?"#3a2b2c":"#332930";g.fillRect(p.x-HW,p.y-HH,HW*2,HH*2);
 const tex=images.stone;
 if(ready(tex)){
  // Stable, non-overlapping texture samples from an unobstructed stone
  // pavement region. No old wall or crate pixels can enter the floor.
  const sx=204+(hash(x,y)%65),sy=12+(hash(y,x)%28);
  g.globalAlpha=.83;g.drawImage(tex,sx,sy,82,42,p.x-HW,p.y-HH,HW*2,HH*2);g.globalAlpha=1;
 }
 const lit=g.createLinearGradient(p.x-HW,p.y-HH,p.x+HW,p.y+HH);
 lit.addColorStop(0,"rgba(209,113,64,.09)");lit.addColorStop(1,"rgba(0,0,0,.17)");g.fillStyle=lit;g.fillRect(p.x-HW,p.y-HH,HW*2,HH*2);
 g.restore();
 g.strokeStyle="rgba(16,12,17,.52)";g.lineWidth=1;poly(q);g.stroke();
}
function tiledFace(points,x,y,side){
 g.save();poly(points);g.clip();
 const p=cen(x,y),tx=images.stone,xy=points.reduce((v,z)=>[Math.min(v[0],z[0]),Math.min(v[1],z[1]),Math.max(v[2],z[0]),Math.max(v[3],z[1])],[1e4,1e4,-1e4,-1e4]);
 const bx=xy[0],by=xy[1],bw=xy[2]-bx,bh=xy[3]-by;
 g.fillStyle=side?"#29232a":"#3b2b2b";g.fillRect(bx,by,bw,bh);
 if(ready(tx)){const sx=side?300:210,sy=side?182:165;g.globalAlpha=side?.76:.91;g.drawImage(tx,sx+(hash(x,y)%25),sy,70,48,bx,by,bw,bh);g.globalAlpha=1;}
 g.fillStyle=side?"rgba(8,8,17,.33)":"rgba(28,14,12,.10)";g.fillRect(bx,by,bw,bh);g.restore();
 g.strokeStyle=side?"#17151b":"#282025";g.lineWidth=1.3;poly(points);g.stroke();
}
function drawWall(x,y){
 const p=cen(x,y),t=p.y-WALL_H;
 const N=[p.x,t-HH],E=[p.x+HW,t],S=[p.x,t+HH],L=[p.x-HW,t];
 const BE=[p.x+HW,p.y],BS=[p.x,p.y+HH],BL=[p.x-HW,p.y];
 tiledFace([L,S,BS,BL],x,y,0);
 tiledFace([S,E,BE,BS],x,y,1);
 g.save();poly([N,E,S,L]);g.clip();g.fillStyle="#60463c";g.fill();
 const tex=images.stone;if(ready(tex)){
  const sx=200+(hash(x,y)%100);g.globalAlpha=.9;g.drawImage(tex,sx,121,82,40,p.x-HW,t-HH,HW*2,HH*2);g.globalAlpha=1;}
 const glow=g.createLinearGradient(p.x-HW,t-HH,p.x+HW,t+HH);
 glow.addColorStop(0,"rgba(219,141,80,.15)");glow.addColorStop(1,"rgba(9,6,18,.31)");
 g.fillStyle=glow;g.fillRect(p.x-HW,t-HH,HW*2,HH*2);g.restore();
 g.strokeStyle="#20171e";g.lineWidth=1.4;poly([N,E,S,L]);g.stroke();
 g.strokeStyle="rgba(223,145,85,.23)";g.lineWidth=.8;g.beginPath();g.moveTo(...N);g.lineTo(...L);g.stroke();
 if(hash(x,y)%13===0){
  g.strokeStyle="#635c36";g.lineWidth=2;g.beginPath();g.moveTo(p.x-7,p.y-WALL_H+12);g.lineTo(p.x-10,p.y-WALL_H+27);g.stroke();
 }
}
function drawGoal(x,y,now){
 const p=cen(x,y),onGoal=atCrate(x,y)!==-1;
 g.save();g.globalAlpha=onGoal?.94:.62;
 shade([[p.x,p.y-11],[p.x+22,p.y],[p.x,p.y+11],[p.x-22,p.y]],"#5f3f2d","#b48e5e");
 g.strokeStyle=onGoal?"#f4c37f":"#aa774b";g.lineWidth=2;
 g.beginPath();g.moveTo(p.x,p.y-7);g.lineTo(p.x+12,p.y);g.lineTo(p.x,p.y+7);g.lineTo(p.x-12,p.y);g.closePath();g.stroke();
 g.fillStyle="#e2b56e";g.fillRect(p.x-2,p.y-2,4,4);g.restore();
}
function drawCrate(p){
 const im=images.crate;
 g.save();g.fillStyle="rgba(0,0,0,.4)";g.beginPath();g.ellipse(p.x+1,p.y+2,26,8,0,0,Math.PI*2);g.fill();
 if(ready(im))g.drawImage(im,Math.round(p.x-27),Math.round(p.y-54),54,65);
 else drawWallPlaceholder(p);
 g.restore();
}
function drawWallPlaceholder(p){g.fillStyle="#71472c";g.fillRect(p.x-21,p.y-42,42,42);}
function drawHero(p,walking,now,alpha){
 const im=walking?images[facing+(Math.floor(now/110)%10)]:images.idle;
 g.save();g.globalAlpha=alpha;
 g.fillStyle="rgba(0,0,0,.45)";g.beginPath();g.ellipse(p.x,p.y+2,14,5,0,0,Math.PI*2);g.fill();
 if(ready(im)){const h=73,w=h*im.naturalWidth/im.naturalHeight;g.drawImage(im,p.x-w/2,p.y-h+3,w,h);}
 else {g.fillStyle="#201a25";g.fillRect(p.x-11,p.y-44,22,44);}
 g.restore();
}
function gate(x,y,kind,now){
 const p=cen(x,y),src=images.gate,opening=kind==="S"?southOpenAt:northOpenAt;
 const open=kind==="S"?solved:!!northOpenAt;
 const elapsed=open?Math.min(1,Math.max(0,(now-opening)/(kind==="S"?1100:900))):0;
 // An arched OPENING replaces this one wall square, never a solid masonry
 // prism underneath the door. Both gates use exactly one grid coordinate.
 const bx=p.x-28,by=p.y-76,bw=56,bh=81;
 g.save();
 g.beginPath();g.moveTo(bx,by+bh);g.lineTo(bx,by+23);
 g.quadraticCurveTo(bx+5,by-7,p.x,by-8);
 g.quadraticCurveTo(bx+bw-5,by-7,bx+bw,by+23);
 g.lineTo(bx+bw,by+bh);g.closePath();g.clip();
 g.fillStyle="#0b0c12";g.fillRect(bx-3,by-8,bw+6,bh+11);
 const darkness=g.createLinearGradient(bx,by,bx+bw,by+bh);
 darkness.addColorStop(0,"#141017");darkness.addColorStop(.55,"#090a10");darkness.addColorStop(1,"#171018");
 g.fillStyle=darkness;g.fillRect(bx,by,bw,bh);
 if(ready(src)){
  if(kind==="N"){
   if(elapsed<1){
    g.save();g.translate(bx+3,0);g.transform(1-.94*elapsed,0,-.07*elapsed,1,0,0);
    g.drawImage(src,0,0,32,47,0,by,bw-6,bh);
    g.restore();
   }
  }else{
   if(elapsed<1){g.save();g.translate(0,-elapsed*90);g.drawImage(src,33,8,24,34,bx,by,bw,bh);g.restore();}
   // Behind the lifted grille there are actual dark stone stairs.
   for(let i=0;i<3;i++){
    const yy=p.y-24+i*11;
    g.fillStyle=i%2?"#34272b":"#292328";g.fillRect(p.x-20+i*2,yy,40-i*4,4);
   }
  }
 }
 g.restore();
 // Stone voussoirs frame the arch on its LEFT, RIGHT and TOP only.
 // Crucially, no full stone block is rendered across the walkable opening.
 const stone=images.stone;
 for(let side=0;side<2;side++){
  const xx=side?bx+bw-7:bx-7;
  g.fillStyle=side?"#34282e":"#513a34";g.fillRect(xx,by+14,14,bh-13);
  if(ready(stone)){g.save();g.beginPath();g.rect(xx,by+14,14,bh-13);g.clip();
   g.drawImage(stone,side?302:215,169,36,65,xx,by+14,14,bh-13);g.restore();}
  g.strokeStyle="#211820";g.lineWidth=1;g.strokeRect(xx,by+14,14,bh-13);
 }
 // The upper stone arch is 12px high and deliberately stays above
 // the walkway, so feet and the lower doorway are never obstructed.
 g.save();g.beginPath();g.moveTo(bx-8,by+25);g.lineTo(bx-7,by+12);
 g.quadraticCurveTo(bx+1,by-20,p.x,by-21);
 g.quadraticCurveTo(bx+bw+4,by-20,bx+bw+7,by+12);
 g.lineTo(bx+bw+8,by+25);g.lineTo(bx+bw-4,by+25);
 g.quadraticCurveTo(bx+bw-4,by-8,p.x,by-8);
 g.quadraticCurveTo(bx+4,by-8,bx+4,by+25);g.closePath();
 g.fillStyle="#493632";g.fill();g.strokeStyle="#241c24";g.lineWidth=2;g.stroke();
 g.strokeStyle="rgba(225,151,86,.37)";g.lineWidth=1;g.beginPath();
 g.moveTo(bx-5,by+19);g.quadraticCurveTo(bx+3,by-16,p.x,by-18);g.stroke();
 g.restore();
}
const cellObjects=[];for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++){
 const ch=grid[y][x];if(ch==="#"||ch==="N"||ch==="S")cellObjects.push({type:ch,x,y});
}
function draw(now){
 if(ready(images.ambient))g.drawImage(images.ambient,0,0,W,H);else{g.fillStyle="#0d0b12";g.fillRect(0,0,W,H);}
 // The environment has EXACTLY ONE source of geometry: LEVEL.tiles.
 // No image of an older maze is layered over the new one.
 for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++)if(grid[y][x]!=="#")tileFloor(x,y);
 for(const q of LEVEL.goals)drawGoal(...q,now);
 let position=cen(...player),walk=false;
 const movingBoxes=crates.map((p,i)=>({p:cen(...p),gridPos:p,index:i}));
 if(tween){
  const t=Math.min(1,(now-tween.start)/tween.duration),a=cen(...tween.from),b=cen(...tween.to);
  position={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};walk=true;
  if(tween.pushing){
   const from=cen(...tween.crateFrom),to=cen(...tween.crateTo);
   movingBoxes[tween.bi].p={x:from.x+(to.x-from.x)*t,y:from.y+(to.y-from.y)*t};
  }
  if(t>=1){tween=null;walk=false;}
 }
 const ents=cellObjects.map(q=>({...q,p:cen(q.x,q.y),depth:q.x+q.y}));
 for(const b of movingBoxes)ents.push({type:"crate",p:b.p,depth:b.gridPos[0]+b.gridPos[1]+.15});
 ents.push({type:"hero",p:position,depth:(position.y-OY)/HH+.28});
 ents.sort((a,b)=>a.depth-b.depth||((a.type==="hero")?1:-1));
 for(const e of ents){
  if(e.type==="#")drawWall(e.x,e.y);
  else if(e.type==="N"||e.type==="S")gate(e.x,e.y,e.type,now);
  else if(e.type==="crate")drawCrate(e.p);
  else drawHero(e.p,walk,now,finished?Math.max(0,1-(now-finishFade)/650):1);
 }
 // Soft vignette and torchlight unify the grid with the illustrated architecture.
 const v=g.createRadialGradient(490,250,80,540,260,620);
 v.addColorStop(0,"rgba(11,5,8,0)");v.addColorStop(1,"rgba(2,3,8,.49)");
 g.fillStyle=v;g.fillRect(0,0,W,H);
 if(finished&&now-finishFade>700)document.querySelector("#ending").classList.add("show");
 if(!tween&&queue.length&&!finished){
  const d=queue.shift();
  if(!move(...d)&&!(on(...plus(player,d))==="N"&&northOpenAt))queue=[];
  else if(!tween&&on(...plus(player,d))==="N"&&northOpenAt)queue.unshift(d);
 }
 requestAnimationFrame(draw);
}
function assertLevel(){
 if(grid.length!==11||grid.some(r=>r.length!==13))throw Error("Invalid grid dimensions");
 const all=[LEVEL.entry,LEVEL.northernGate,LEVEL.southernGate,LEVEL.southLanding,...LEVEL.crates,...LEVEL.goals];
 for(const p of all)if(!on(...p)||on(...p)==="#")throw Error("Entity occupies a wall: "+K(...p));
 for(const goal of LEVEL.goals)if(!LEVEL.tiles[goal[1]]||on(...goal)==="#")throw Error("Invalid goal");
 for(const [x,y] of all){for(const d of dirs){const n=plus([x,y],d);if(!isWall(...n)&&isWall(...n)===false){/* single square step */}}}
}
assertLevel();
window.__darknessCellar={get state(){return snapshot();},level:LEVEL,step,cen,debugTile:pointerTile,reset};
requestAnimationFrame(draw);
})();
