<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darkness — Kamenné sklepení</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030405;color:#cfbb9b}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
#stage{position:relative;width:min(1220px,100vw);aspect-ratio:1085 / 566;overflow:hidden;background:#07070c}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:pointer}
#actions{position:absolute;top:12px;right:13px;display:flex;gap:7px;opacity:.54;transition:opacity .2s}
#actions:hover,#actions:focus-within{opacity:1}
button{border:1px solid #79654d;border-radius:4px;width:36px;height:36px;font:22px Georgia,serif;cursor:pointer;background:rgba(13,12,14,.80);color:#ddc2a3}
button:hover,button:focus-visible{background:rgba(93,66,49,.9);outline-color:#d9b98b}
#touchpad{position:absolute;left:10px;bottom:10px;display:none;gap:5px;opacity:.67}
#touchpad button{width:45px;height:45px}
#win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;pointer-events:none;background:radial-gradient(ellipse at 52% 42%,rgba(5,9,12,.35),rgba(1,2,5,.86));font:clamp(19px,3.1vw,32px) Georgia,serif;letter-spacing:.08em;color:#e5c99f;text-shadow:0 3px 7px #000}
#win.show{display:flex}#win small{display:block;margin-top:18px;font-size:clamp(12px,1.65vw,17px);letter-spacing:.02em;color:#b1a597;font-style:italic}
@media (max-width:720px) and (pointer:coarse){#touchpad{display:flex}}
</style>
</head>
<body>
<div id="stage">
<canvas id="game" width="1085" height="566" aria-label="Isometrické sklepení s posuvnými bednami"></canvas>
<div id="actions"><button id="back" title="Zpět do cely" aria-label="Zpět do cely">↶</button><button id="undo" title="Vrátit tah" aria-label="Vrátit tah">↰</button><button id="restart" title="Znovu" aria-label="Znovu">↻</button><button id="mute" title="Přepnout zvuk" aria-label="Přepnout zvuk">♫</button></div>
<div id="touchpad"><button data-move="0,-1" aria-label="Severovýchod">↗</button><button data-move="1,0" aria-label="Jihovýchod">↘</button><button data-move="0,1" aria-label="Jihozápad">↙</button><button data-move="-1,0" aria-label="Severozápad">↖</button></div>
<div id="win" aria-live="polite">PRŮCHOD JE VOLNÝ<small>Staré kameny konečně ustoupily...</small></div>
<audio id="ambient" src="assets/music/before_the_light_soft_soundblaster.ogg" loop preload="none"></audio>
<audio id="victory" src="assets/music/whisper_under_stone_soundblaster.ogg" loop preload="none"></audio>
</div>
<script>
(() => {
'use strict';
/* The displayed stone obstacles and this collision blueprint are composed
   from the SAME immutable tile matrix. The room is pre-rendered once, and
   only player and crates are painted dynamically. Never stack two maps. */
const GRID = [
  '..###..##',
  '..B..#...',
  '..#..#.#E',
  'S#..#..#.',
  'B...#...#',
  '##.B..#.#',
  '####...##'
];
const W=9,H=7,OX=480,OY=218,HALF_W=31,HALF_H=17;
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const floor=new Set(),walls=new Set(),startCrates=[];
let start={x:0,y:0},exit={x:0,y:0};
const key=(x,y)=>`${x},${y}`;
const at=(x,y)=>({x:OX+(x-y)*HALF_W,y:OY+(x+y)*HALF_H});
for(let y=0;y<H;y++) for(let x=0;x<W;x++) {
  const v=GRID[y][x];
  if(v==='#') walls.add(key(x,y)); else floor.add(key(x,y));
  if(v==='S') start={x,y};
  if(v==='E') exit={x,y};
  if(v==='B') startCrates.push({x,y});
}
if(startCrates.length!==3||!floor.has(key(exit.x,exit.y)))throw Error('Invalid cellar level');
const bg=new Image(),crateSprite=new Image();
bg.src='assets/scene/cellar_aligned_v6.jpg';
crateSprite.src='assets/props/crate_v6.png';
const heroImgs={};
function load(name,url){const im=new Image();im.src=url;heroImgs[name]=im;}
load('idle','assets/character/idle/00.png');
for(const dir of ['walk_right','walk_left'])for(let i=0;i<10;i++)load(`${dir}_${i}`,`assets/character/${dir}/${String(i).padStart(2,'0')}.png`);
const ambient=document.querySelector('#ambient'),victory=document.querySelector('#victory');
ambient.volume=.24;victory.volume=0;
const win=document.querySelector('#win');
let actor={...start},crates=startCrates.map(p=>({...p})),moveCount=0,pushCount=0,finished=false;
let undoStack=[],pending=[],tween=null,facing='walk_right',muted=false,everPlayed=false,audioCtx=null;
let victoryFadeStart=0,lastQueued=0;
const valid=(x,y)=>floor.has(key(x,y));
const crateIndex=(x,y)=>crates.findIndex(p=>p.x===x&&p.y===y);
function save(){try{localStorage.setItem('darkness_cellar_v6',JSON.stringify({actor,crates,moveCount,pushCount,finished}));}catch(e){}}
function loadState(){try{
  const p=JSON.parse(localStorage.getItem('darkness_cellar_v6'));
  if(!p||!Array.isArray(p.crates)||p.crates.length!==3||!p.actor)return;
  if(!valid(p.actor.x,p.actor.y)||p.crates.some(b=>!valid(b.x,b.y)))return;
  const set=new Set(p.crates.map(b=>key(b.x,b.y)));
  if(set.size!==3||set.has(key(p.actor.x,p.actor.y)))return;
  actor={...p.actor};crates=p.crates.map(b=>({...b}));moveCount=p.moveCount|0;pushCount=p.pushCount|0;
  finished=actor.x===exit.x&&actor.y===exit.y;win.classList.toggle('show',finished);
}catch(e){}}
function soundStart(){everPlayed=true;
 try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}
 if(!muted&&!finished&&ambient.paused) ambient.play().catch(()=>{});
}
function beep(freq=.0,dur=.15,vol=.035,type='triangle'){
 if(!audioCtx||muted)return;
 const t=audioCtx.currentTime,o=audioCtx.createOscillator(),gain=audioCtx.createGain();
 o.type=type;o.frequency.value=freq;
 gain.gain.setValueAtTime(vol,t);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(gain).connect(audioCtx.destination);o.start(t);o.stop(t+dur);
}
function solved(){
 finished=true;pending=[];win.classList.add('show');
 if(!muted){[196,247,294,370,494].forEach((n,i)=>setTimeout(()=>beep(n,.75,.08,'sine'),i*170));}
 ambient.pause();victory.currentTime=0;victory.volume=0;
 if(!muted)victory.play().catch(()=>{});
 victoryFadeStart=performance.now();save();
}
function move(dx,dy){
 if(finished||tween||(!dx&&!dy))return false;
 const nx=actor.x+dx,ny=actor.y+dy;
 if(!valid(nx,ny)){beep(87,.08,.024);return false;}
 const i=crateIndex(nx,ny);
 let boxMove=null;
 if(i>=0){const tx=nx+dx,ty=ny+dy;
   if(!valid(tx,ty)||crateIndex(tx,ty)>=0){beep(77,.13,.027);return false;}
   boxMove={i,from:{...crates[i]},to:{x:tx,y:ty}};
 }
 undoStack.push({actor:{...actor},crates:crates.map(p=>({...p})),moveCount,pushCount});
 if(undoStack.length>500)undoStack.shift();
 const from={...actor};actor={x:nx,y:ny};moveCount++;
 if(boxMove){crates[i]={...boxMove.to};pushCount++;beep(65,.32,.065,'sawtooth');}
 else beep(120,.055,.023);
 facing=(dx-dy)>=0?'walk_right':'walk_left';
 tween={from,to:{...actor},start:performance.now(),dur:boxMove?265:170,boxMove};
 save();return true;
}
function undo(){if(!undoStack.length)return;
 pending=[];tween=null;const st=undoStack.pop();
 actor=st.actor;crates=st.crates;moveCount=st.moveCount;pushCount=st.pushCount;
 finished=false;win.classList.remove('show');victory.pause();victory.currentTime=0;victoryFadeStart=0;
 if(everPlayed&&!muted)ambient.play().catch(()=>{});
 beep(185,.15,.047);save();
}
function restart(){pending=[];tween=null;undoStack=[];
 actor={...start};crates=startCrates.map(p=>({...p}));moveCount=0;pushCount=0;finished=false;
 win.classList.remove('show');victory.pause();victory.currentTime=0;victoryFadeStart=0;
 if(everPlayed&&!muted){ambient.currentTime=0;ambient.volume=.24;ambient.play().catch(()=>{});}save();
}
const directions=[[1,0],[-1,0],[0,1],[0,-1]];
function shortestPath(dest){
 if(!valid(dest.x,dest.y)||crateIndex(dest.x,dest.y)>=0)return null;
 const origin=key(actor.x,actor.y),target=key(dest.x,dest.y),queue=[{...actor}],came=new Map([[origin,null]]);
 for(let i=0;i<queue.length;i++){
  const p=queue[i];if(key(p.x,p.y)===target)break;
  for(const [dx,dy] of directions){const nx=p.x+dx,ny=p.y+dy,k=key(nx,ny);
    if(valid(nx,ny)&&crateIndex(nx,ny)<0&&!came.has(k)){
      came.set(k,{before:key(p.x,p.y),step:[dx,dy]});queue.push({x:nx,y:ny});
    }
  }
 }
 if(!came.has(target))return null;
 const result=[];let k=target;
 while(k!==origin){const p=came.get(k);result.unshift(p.step);k=p.before;}
 return result;
}
function clickAt(e){
 soundStart();if(finished)return;
 const bb=canvas.getBoundingClientRect();
 const px=(e.clientX-bb.left)/bb.width*1085,py=(e.clientY-bb.top)/bb.height*566;
 // Hit-test actual sprite footprint first. Pixel art crates extend ABOVE
 // the floor tile; inverse-isometric mapping alone misidentified them.
 let clicked=-1,dist=Infinity;
 for(let i=0;i<crates.length;i++){
  const p=at(crates[i].x,crates[i].y),dx=(px-p.x)/29,dy=(py-(p.y-19))/36;
  if(Math.abs(dx)<1.05&&Math.abs(dy)<1.2&&dx*dx+dy*dy<dist){clicked=i;dist=dx*dx+dy*dy;}
 }
 if(clicked>=0){const b=crates[clicked];let best=null;
  for(const [dx,dy] of directions){const tx=b.x+dx,ty=b.y+dy,stand={x:b.x-dx,y:b.y-dy};
   if(!valid(tx,ty)||crateIndex(tx,ty)>=0||!valid(stand.x,stand.y)||crateIndex(stand.x,stand.y)>=0)continue;
   const route=shortestPath(stand);
   if(route!==null&&(!best||route.length<best.length))best=[...route,[dx,dy]];
  }
  if(best){pending=best;lastQueued=0;}
  return;
 }
 // For floor clicks, identify the nearest valid tile within its actual
 // projected diamond: no hidden snapping through wall artwork.
 const ux=(px-OX)/HALF_W,uy=(py-OY)/HALF_H;
 const tx=Math.round((ux+uy)/2),ty=Math.round((uy-ux)/2);
 if(!valid(tx,ty))return;
 const p=at(tx,ty);
 if(Math.abs(px-p.x)/HALF_W+Math.abs(py-p.y)/HALF_H>1.3)return;
 const route=shortestPath({x:tx,y:ty});if(route)pending=route;
}
canvas.addEventListener('pointerdown',clickAt);
document.addEventListener('keydown',e=>{
 const keymap={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,-1],ArrowDown:[0,1],
  d:[1,0],a:[-1,0],w:[0,-1],s:[0,1],D:[1,0],A:[-1,0],W:[0,-1],S:[0,1]};
 if(keymap[e.key]){e.preventDefault();soundStart();const d=keymap[e.key];
   if(tween){pending=[d];} else {pending=[];move(...d);}
 }else if(e.key.toLowerCase()==='z'){e.preventDefault();undo();}
 else if(e.key.toLowerCase()==='r'){e.preventDefault();restart();}
});
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{
 soundStart();const d=b.dataset.move.split(',').map(Number);
 if(tween)pending=[d];else{pending=[];move(...d);}
}));
document.querySelector('#back').onclick=()=>window.location.href='index.html';
document.querySelector('#undo').onclick=undo;
document.querySelector('#restart').onclick=restart;
document.querySelector('#mute').onclick=()=>{
 muted=!muted;ambient.muted=muted;victory.muted=muted;
 document.querySelector('#mute').style.opacity=muted?'.45':'1';
 if(!muted){soundStart();(finished?victory:ambient).play().catch(()=>{});}
};
function draw(now){
 ctx.clearRect(0,0,1085,566);
 if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,1085,566);
 else {ctx.fillStyle='#12141a';ctx.fillRect(0,0,1085,566);}
 if(victoryFadeStart){const q=Math.min(1,(now-victoryFadeStart)/2300);
  ambient.volume=.24*(1-q);victory.volume=.5*q;if(q>=1)victoryFadeStart=0;
 }
 let px=actor.x,py=actor.y,walking=false;
 if(tween){const t=Math.min(1,(now-tween.start)/tween.dur),k=t*t*(3-2*t);
  px=tween.from.x+(actor.x-tween.from.x)*k;py=tween.from.y+(actor.y-tween.from.y)*k;
  walking=t<1;
  if(t>=1){tween=null;if(actor.x===exit.x&&actor.y===exit.y&&!finished)solved();}
 }
 const entities=[];
 for(let i=0;i<crates.length;i++){
  let x=crates[i].x,y=crates[i].y;
  if(tween?.boxMove?.i===i){const b=tween.boxMove,t=Math.min(1,(now-tween.start)/tween.dur),k=t*t*(3-2*t);
   x=b.from.x+(b.to.x-b.from.x)*k;y=b.from.y+(b.to.y-b.from.y)*k;
  }
  entities.push({type:'crate',x,y,depth:x+y});
 }
 if(!finished)entities.push({type:'hero',x:px,y:py,depth:px+py+.08});
 entities.sort((a,b)=>a.depth-b.depth);
 for(const v of entities){const p=at(v.x,v.y);
  if(v.type==='crate'){
    ctx.fillStyle='rgba(0,0,0,.48)';ctx.beginPath();ctx.ellipse(p.x,p.y+9,25,8,0,0,Math.PI*2);ctx.fill();
    if(crateSprite.complete&&crateSprite.naturalWidth){ctx.drawImage(crateSprite,p.x-28,p.y-49,56,62);}
  }else{
    ctx.fillStyle='rgba(0,0,0,.52)';ctx.beginPath();ctx.ellipse(p.x,p.y+8,14,5,0,0,Math.PI*2);ctx.fill();
    const f=(Math.floor(now/165)%10),img=walking?(heroImgs[`${facing}_${f}`]||heroImgs.idle):heroImgs.idle;
    if(img?.complete&&img.naturalWidth){const height=79,width=height*img.naturalWidth/img.naturalHeight;
      ctx.drawImage(img,p.x-width/2,p.y-height+9,width,height);
    }
  }
 }
 if(pending.length&&!tween&&!finished&&now-lastQueued>55){lastQueued=now;const d=pending.shift();
  if(!move(...d))pending=[];
 }
 requestAnimationFrame(draw);
}
loadState();requestAnimationFrame(draw);
})();
</script>
</body></html>
