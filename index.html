<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kobka čaroděje</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: #05040a;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    padding: 0;
  }
  .stage {
    width: 100vw;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .screen-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1085 / 566;
    overflow: hidden;
    background: #000;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  /* hotspot name strip — lives OUTSIDE the picture, between the screen and the inventory */
  .hover-strip {
    width: 100%;
    min-height: 1.9em;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .hover {
    font-family: 'VT323', monospace;
    font-size: clamp(20px, 2.6vw, 26px);
    color: #d8b988;
    opacity: 0;
    transition: opacity .12s;
    pointer-events: none;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .hover.show { opacity: 1; }

  /* floating dialogue text — no frame, rolls in letter by letter */
  .popup {
    position: absolute;
    max-width: 64%;
    color: #f3e3b8;
    font-family: 'VT323', monospace;
    font-size: clamp(23px, 3vw, 30px);
    line-height: 1.3;
    letter-spacing: 0.5px;
    text-align: center;
    text-shadow:
      2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000,
      2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -100%);
    transition: opacity .2s ease;
    z-index: 5;
  }
  .popup.show { opacity: 1; }

  /* inventory bar, below the full screen: plain black, bare items, no boxes */
  .inventory-bar {
    width: 100%;
    background: #000;
    padding: 8px 2.5%;
    display: flex;
    align-items: center;
    min-height: 5.5vw;
  }
  .inventory {
    display: flex;
    gap: 4px;
  }
  .slot {
    width: clamp(40px, 6.2vw, 64px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }
  .slot img {
    width: 92%; height: 92%;
    object-fit: contain;
    image-rendering: pixelated;
    transition: filter .15s;
  }
  .slot.held img {
    filter: drop-shadow(0 0 5px #e4c479) drop-shadow(0 0 9px rgba(228,196,121,0.7));
  }
  .slot img.pop-in { animation: popIn .32s cubic-bezier(.26,1.4,.4,1); }
  @keyframes popIn {
    0%   { transform: scale(0.15) translateY(8px); opacity: 0; }
    65%  { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* tiny unobtrusive icon controls, top-right */
  .controls {
    position: absolute;
    right: 2%; top: 3%;
    display: flex;
    gap: 8px;
    z-index: 6;
  }
  .ctrlbtn {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(8,6,10,0.5);
    border: 1px solid rgba(95,78,55,0.6);
    color: #d8b988;
    font-size: 12px;
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity .2s;
  }
  .ctrlbtn:hover { opacity: 1; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="screen-wrap" id="screenWrap">
    <canvas id="room" width="1085" height="566" aria-label="Prozkoumej kobku klikáním na podlahu nebo na předměty"></canvas>
    <div id="popup" class="popup"></div>
    <div class="controls">
      <div class="ctrlbtn" id="muteBtn" title="Přepnout hudbu">♪</div>
      <div class="ctrlbtn" id="resetBtn" title="Restartovat">↺</div>
    </div>
    <audio id="bgm" loop preload="auto">
      <source src="assets/music/whisper_under_stone_soundblaster.ogg" type="audio/ogg">
      <source src="assets/music/whisper_under_stone_soundblaster.wav" type="audio/wav">
    </audio>
    <audio id="bgmDark" loop preload="auto">
      <source src="assets/music/before_the_light_soft_soundblaster.ogg" type="audio/ogg">
      <source src="assets/music/before_the_light_soft_soundblaster.wav" type="audio/wav">
    </audio>
  </div>
  <div class="hover-strip"><div id="hover" class="hover"></div></div>
  <div class="inventory-bar">
    <div class="inventory" id="inventory"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const screenWrap = document.querySelector('#screenWrap');
const stage = document.querySelector('#stage');
const canvas = document.querySelector('#room'), ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const hover = document.querySelector('#hover');
const popupEl = document.querySelector('#popup');
const invEl = document.querySelector('#inventory');
const bgm = document.querySelector('#bgm');
const bgmDark = document.querySelector('#bgmDark');
const muteBtn = document.querySelector('#muteBtn');
const resetBtn = document.querySelector('#resetBtn');

/* ---------- hand-painted contextual cursors ---------- */
const CURSORS = {
  walk: 'url("assets/cursors/walk.png") 6 10, auto',
  examine: 'url("assets/cursors/examine.png") 20 20, auto',
  use: 'url("assets/cursors/use.png") 30 28, auto',
  talk: 'url("assets/cursors/talk.png") 30 28, auto',
  pickup: 'url("assets/cursors/pickup.png") 28 26, auto'
};
/* while an item is held, the cursor itself becomes that item's icon */
const HELD_CURSORS = {
  matchbox: 'url("assets/cursors/held_matchbox.png") 38 38, auto',
  iron_key: 'url("assets/cursors/held_iron_key.png") 38 38, auto',
  paper: 'url("assets/cursors/held_paper.png") 38 38, auto',
  green_potion: 'url("assets/cursors/held_green_potion.png") 38 38, auto'
};
stage.style.cursor = CURSORS.walk;
function cursorForHotspot(h) {
  if (!h) return 'walk';
  switch (h.id) {
    case 'shelf': return (!paperRevealed || found.iron_key) ? 'examine' : 'pickup';
    case 'chest': return found.paper ? 'examine' : 'pickup';
    case 'table': return found.green_potion ? 'examine' : 'pickup';
    case 'door': return found.iron_key ? 'use' : 'examine';
    case 'matchbox': return matchTaken ? 'examine' : 'pickup';
    case 'candle': return 'examine';
    default: return 'examine';
  }
}

/* ---------- audio: looping theme(s) + synthesized click blips ---------- */
let actx = null, muted = false;
function fadeAudio(el, from, to, durMs) {
  const start = performance.now();
  function step(t) {
    const p = Math.min(1, (t - start) / durMs);
    el.volume = from + (to - from) * p;
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
/* generic value ramp — used so scene changes fade smoothly instead of blinking in/out */
function rampValue(onUpdate, from, to, durMs) {
  const start = performance.now();
  function step(t) {
    const p = Math.min(1, (t - start) / durMs);
    onUpdate(from + (to - from) * p);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function unlockAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  bgmDark.volume = 0;
  bgmDark.play().catch(() => {});
  fadeAudio(bgmDark, 0, 0.5, 3000);
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
function playClick() {
  if (!actx || muted) return;
  const t = actx.currentTime, dur = 0.018;
  const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * dur), actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = actx.createBufferSource();
  noise.buffer = buf;
  const filt = actx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = 2600;
  filt.Q.value = 0.7;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0.4, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  noise.connect(filt); filt.connect(gain); gain.connect(actx.destination);
  noise.start(t); noise.stop(t + dur);
}
function playChestOpen() {
  if (!actx || muted) return;
  const t = actx.currentTime;
  // creak: filtered noise with a slow downward pitch sweep
  const creakDur = 0.5;
  const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * creakDur), actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = actx.createBufferSource();
  noise.buffer = buf;
  const filt = actx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.Q.value = 7;
  filt.frequency.setValueAtTime(1400, t);
  filt.frequency.exponentialRampToValueAtTime(420, t + creakDur);
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.22, t + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.001, t + creakDur);
  noise.connect(filt); filt.connect(gain); gain.connect(actx.destination);
  noise.start(t); noise.stop(t + creakDur);
  // thud: low sine/triangle thump shortly after
  const thudT = t + creakDur + 0.05, thudDur = 0.22;
  const osc = actx.createOscillator(), og = actx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(110, thudT);
  osc.frequency.exponentialRampToValueAtTime(55, thudT + thudDur);
  og.gain.setValueAtTime(0.5, thudT);
  og.gain.exponentialRampToValueAtTime(0.001, thudT + thudDur);
  osc.connect(og); og.connect(actx.destination);
  osc.start(thudT); osc.stop(thudT + thudDur);
}
function playDeathSound() {
  if (!actx || muted) return;
  const t = actx.currentTime;
  // dissonant descending drone: two detuned saws beating against each other
  const dur = 2.5;
  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(900, t);
  lp.frequency.exponentialRampToValueAtTime(110, t + dur * 0.85);
  const dGain = actx.createGain();
  dGain.gain.setValueAtTime(0.0001, t);
  dGain.gain.exponentialRampToValueAtTime(0.22, t + 0.2);
  dGain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  dGain.connect(lp); lp.connect(actx.destination);
  [96, 101].forEach(f0 => {
    const o = actx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.42, t + dur);
    o.connect(dGain);
    o.start(t); o.stop(t + dur + 0.05);
  });
  // sub-bass weight underneath
  const sub = actx.createOscillator(), subGain = actx.createGain();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(58, t);
  sub.frequency.exponentialRampToValueAtTime(26, t + dur * 0.8);
  subGain.gain.setValueAtTime(0.0001, t);
  subGain.gain.exponentialRampToValueAtTime(0.5, t + 0.12);
  subGain.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.9);
  sub.connect(subGain); subGain.connect(actx.destination);
  sub.start(t); sub.stop(t + dur);
  // sharp noise sting at the instant of impact
  const stingDur = 0.4;
  const sBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * stingDur), actx.sampleRate);
  const sData = sBuf.getChannelData(0);
  for (let i = 0; i < sData.length; i++) sData[i] = (Math.random() * 2 - 1) * (1 - i / sData.length);
  const sting = actx.createBufferSource(); sting.buffer = sBuf;
  const sFilt = actx.createBiquadFilter();
  sFilt.type = 'bandpass'; sFilt.frequency.setValueAtTime(2200, t); sFilt.Q.value = 3.5;
  const sGain = actx.createGain();
  sGain.gain.setValueAtTime(0.3, t);
  sGain.gain.exponentialRampToValueAtTime(0.0001, t + stingDur);
  sting.connect(sFilt); sFilt.connect(sGain); sGain.connect(actx.destination);
  sting.start(t); sting.stop(t + stingDur);
}
muteBtn.addEventListener('click', () => {
  muted = !muted;
  bgm.muted = muted;
  bgmDark.muted = muted;
  muteBtn.style.opacity = muted ? '0.25' : '0.45';
  muteBtn.textContent = muted ? '♪̸' : '♪';
});

/* ---------- floating popup bubble (replaces the fixed text bar) ---------- */
let popupTimer = null, typeTimer = null;
function popupAtPercent(xPct, yPct, text) {
  xPct = Math.max(8, Math.min(92, xPct));
  yPct = Math.max(8, Math.min(92, yPct));
  popupEl.style.left = xPct + '%';
  popupEl.style.top = yPct + '%';
  popupEl.classList.add('show');
  clearTimeout(popupTimer);
  clearInterval(typeTimer);
  popupEl.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    i++;
    popupEl.textContent = text.slice(0, i);
    if (i >= text.length) {
      clearInterval(typeTimer);
      popupTimer = setTimeout(() => popupEl.classList.remove('show'), Math.max(1800, text.length * 55));
    }
  }, 28);
}
function sayAtHero(text) {
  popupAtPercent(hero.x / 1085 * 100, (hero.y - 300) / 566 * 100, text);
}
function sayAtClient(clientX, clientY, text) {
  const r = screenWrap.getBoundingClientRect();
  popupAtPercent((clientX - r.left) / r.width * 100, (clientY - r.top) / r.height * 100 - 6, text);
}

/* ---------- game state ---------- */
const aCount = { walk_right: 10, walk_left: 10, idle: 10, examine: 6, use: 10 };
const frameMs = { walk_right: 180, walk_left: 180, idle: 150, examine: 200, use: 230 };
/* idle holds its first pose for a long, mostly-still beat, then cycles small shifts */
const idleTiming = [8500, 150, 150, 150, 150, 150, 150, 150, 150, 150];
const idleTotal = idleTiming.reduce((a, b) => a + b, 0);
function idleFrameAt(phaseMs) {
  let t = phaseMs % idleTotal;
  for (let i = 0; i < idleTiming.length; i++) { if (t < idleTiming[i]) return i; t -= idleTiming[i]; }
  return 0;
}

let images = {};
const getImage = (key, src) => { const img = new Image(); images[key] = img; img.src = src; };
getImage('room', 'assets/scene/dungeon_clean_no_potion_1085x566.png');
getImage('potionSprite', 'assets/props/potion_table_sprite.png');
const POTION_POS = { x: 628, y: 283, w: 68, h: 70 };
getImage('chestOpen', 'assets/props/chest_open.png');
const CHEST_OPEN_POS = { x: 133, y: 366, w: 197, h: 169 };
getImage('roomDark', 'assets/scene/dungeon_dark_1085x566.png');
getImage('matchbox', 'assets/items/matchbox_closed.png');
for (const [a, n] of Object.entries(aCount)) for (let j = 0; j < n; j++) getImage(`${a}_${j}`, `assets/character/${a}/${String(j).padStart(2, '0')}.png`);
getImage('paper', 'assets/props/pentagram_scroll.png');
for (const id of ['iron_key', 'green_potion']) getImage(id, `assets/props/${id}.png`);

let found = { iron_key: false, paper: false, green_potion: false };
let openChest = false, escaped = false, dead = false, deathFade = 0, poisonFade = 0, paperRevealed = false;
let gameState = 'dark', matchTaken = false, litMix = 0, igniting = false;
let matchFade = 1, potionMix = 0, chestMix = 0;
const MATCH_POS = [230, 460], CANDLE_POS = [770, 538];
let hero = { x: 421, y: 515, destX: 421, destY: 515, action: 'idle', face: 'walk_right', actUntil: 0, phase: 0, queued: null };
let last = 0;

const darkHotspots = [
  { id: 'matchbox', title: 'Krabička sirek', box: [190, 420, 270, 495], to: [250, 540] },
  { id: 'candle', title: 'Nedohořelá svíce', box: [745, 255, 800, 370], to: [770, 538] },
  { id: 'window', title: 'Zamřížované okno', box: [699, 61, 870, 256], to: [792, 538] }
];
const litHotspots = [
  { id: 'shelf', title: 'Zaprášené knihy', box: [90, 110, 343, 424], to: [355, 541] },
  { id: 'chest', title: 'Okovaná truhla', box: [132, 421, 337, 554], to: [330, 548] },
  { id: 'rune', title: 'Tajemný diagram', box: [448, 144, 606, 266], to: [590, 537] },
  { id: 'table', title: 'Alchymistický stůl', box: [515, 270, 819, 470], to: [675, 538] },
  { id: 'window', title: 'Zamřížované okno', box: [699, 61, 870, 256], to: [792, 538] },
  { id: 'door', title: 'Zamčené dveře cely', box: [888, 80, 1074, 490], to: [918, 540] }
];
function currentHotspots() { return gameState === 'dark' ? darkHotspots : litHotspots; }

const ITEM_DEFS = {
  matchbox: { name: 'Krabička sirek', icon: 'assets/items/matchbox_open_inventory.png', desc: 'Otevřená krabička sirek. Uvnitř zbývá jen pár kousků.', invScale: 1.5 },
  iron_key: { name: 'Železný klíč', icon: 'assets/props/iron_key.png', desc: 'Železný klíč, ještě teplý. Jeho zuby mají tvar malých kůstek.', invScale: 1 },
  paper: { name: 'Popsaný pergamen', icon: 'assets/props/pentagram_scroll.png', desc: 'List pergamenu, popsaný podivnými, rozmazanými znaky. Možná by pomohlo víc světla.', invScale: 1 },
  green_potion: { name: 'Zelený lektvar', icon: 'assets/props/green_potion.png', desc: 'Elixír měsíčního kořene. Jedna kapka připomene staré magii její účel.', invScale: 0.72 }
};
let heldItem = null, prevInvKeys = [];
function selectItem(key) {
  if (dead || escaped) return;
  heldItem = (heldItem === key) ? null : key;
  stage.style.cursor = heldItem ? HELD_CURSORS[heldItem] : CURSORS.walk;
  renderInventory();
}
function renderInventory() {
  if (dead) { invEl.innerHTML = ''; return; }
  const keys = [];
  if (matchTaken) keys.push('matchbox');
  for (const k of ['iron_key', 'paper', 'green_potion']) if (found[k]) keys.push(k);
  invEl.innerHTML = '';
  for (const key of keys) {
    const el = document.createElement('div');
    el.className = 'slot' + (heldItem === key ? ' held' : '');
    const def = ITEM_DEFS[key];
    const img = document.createElement('img');
    img.src = def.icon;
    img.alt = def.name;
    img.title = def.name + ' — ' + def.desc;
    const pct = 92 * (def.invScale || 1);
    img.style.width = pct + '%';
    img.style.height = pct + '%';
    if (!prevInvKeys.includes(key)) img.classList.add('pop-in');
    el.append(img);
    el.addEventListener('click', (ev) => { ev.stopPropagation(); playClick(); selectItem(key); });
    invEl.append(el);
  }
  prevInvKeys = keys.slice();
}

function give(key) { found[key] = true; renderInventory(); }
function useItemOn(hotspotId) { inspect(hotspotId); heldItem = null; stage.style.cursor = CURSORS.walk; renderInventory(); }
function gesture(action, time = 850) { hero.action = action; hero.phase = 0; hero.actUntil = performance.now() + time; }

function startLitTransition() {
  gameState = 'lit';
  const startT = performance.now(), DUR = 2200;
  function stepMix(t) {
    litMix = Math.min(1, (t - startT) / DUR);
    if (litMix < 1) requestAnimationFrame(stepMix);
  }
  requestAnimationFrame(stepMix);
  fadeAudio(bgmDark, bgmDark.volume, 0, DUR);
  bgm.currentTime = 0; bgm.volume = 0; bgm.play().catch(() => {});
  fadeAudio(bgm, 0, 0.55, DUR);
  setTimeout(() => { bgmDark.pause(); igniting = false; }, DUR + 100);
}

function inspect(id) {
  if (id === 'matchbox') {
    if (!matchTaken) {
      matchTaken = true; renderInventory();
      rampValue(v => matchFade = v, 1, 0, 450);
      sayAtHero('Zvedneš krabičku sirek z dlažby a otevřeš ji.'); gesture('use', 1000);
    } else { sayAtHero('Na dlažbě už nic není.'); gesture('examine'); }
    return;
  }
  if (id === 'candle') {
    if (igniting) return;
    if (heldItem === 'matchbox') { igniting = true; gesture('use', 1300); sayAtHero('Škrtneš sirkou a zapálíš svíci.'); setTimeout(startLitTransition, 1300); }
    else if (matchTaken) { sayAtHero('Musím držet sirky v ruce, abych svíci zapálil.'); gesture('examine'); }
    else { sayAtHero('Je příliš velká tma. Potřebuju světlo.'); gesture('examine'); }
    return;
  }
  if (id === 'shelf') {
    if (!paperRevealed) { sayAtHero('Řady zaprášených svazků. Bez vodítka bych tu mohl pátrat donekonečna.'); gesture('examine'); }
    else if (!found.iron_key) { give('iron_key'); sayAtHero('Jedna kniha se nehne, jako by ji svíral neviditelný zámek. Zatáhneš za hřbet — a za ní se skrývá starý železný klíč.'); gesture('use', 1100); }
    else { sayAtHero('Za knihou už nic není, jen prázdná škvíra ve zdi.'); gesture('examine'); }
  }
  if (id === 'chest') {
    if (!found.paper) {
      give('paper'); openChest = true;
      playChestOpen();
      rampValue(v => chestMix = v, 0, 1, 550);
      sayAtHero('Víko zavrže a povolí. Uvnitř leží jediný list pergamenu, popsaný podivnými, rozmazanými znaky.'); gesture('use', 1100);
    } else { sayAtHero('Na dně je už jen suchá sláma.'); gesture('examine'); }
  }
  if (id === 'rune') { sayAtHero('Pěticípá pečeť. Pod ní je vyryto: "Zelený plamen si pamatuje cestu."'); gesture('examine'); }
  if (id === 'table') {
    if (!found.green_potion) {
      give('green_potion');
      rampValue(v => potionMix = v, 0, 1, 550);
      sayAtHero('Zelený lektvar při doteku tiše hučí. Schováš si elixír měsíčního kořene do kapsy.'); gesture('use', 1150);
    } else { sayAtHero('Prázdný stůl voní rozmarýnem a něčím mnohem méně příjemným.'); gesture('examine'); }
  }
  if (id === 'window') {
    if (heldItem === 'paper') {
      if (!paperRevealed) {
        paperRevealed = true;
        ITEM_DEFS.paper.desc = 'Ve světle měsíce se mezi řádky objevilo skryté písmo: "Kniha, jež se nikdy neotevřela vlastní vůlí, ukrývá cestu ven."';
        sayAtHero('Přiložíš pergamen k měsíčnímu svitu. Mezi řádky se jako stříbrná nit vyjeví skrytá slova: "Kniha, jež se nikdy neotevřela vlastní vůlí, ukrývá cestu ven."');
        gesture('use', 1500);
      } else { sayAtHero('Skrytá slova už znáš nazpaměť.'); gesture('examine'); }
      return;
    }
    if (gameState === 'dark') { sayAtHero('Vysoko na obloze visí úplněk a zalévá mříže studeným stříbrným svitem. Za oknem šumí vítr v korunách borovic — jinak panuje naprosté ticho noci.'); }
    else { sayAtHero('Měsíc stojí vysoko. Za mřížemi se ve větru komíhají černé jedle.'); }
    gesture('examine');
  }
  if (id === 'door') {
    if (found.iron_key) {
      escaped = true;
      gesture('use', 1800);
      sayAtHero('Vložíš klíč do zámku. Těžký cvakot — dveře povolí!');
    } else { sayAtHero('Těžké dveře jsou zamčené. Potřebuju klíč.'); gesture('examine'); }
  }
}

const SELF_LINES = [
  'Hlava se mi točí a klouby bolí, jako bych tu byl vězněn celé týdny.',
  'Ruce se mi třesou. Musím odsud pryč, než mě ta tma pohltí docela.',
  'Žaludek se mi zvedá a ve spáncích mi buší vlastní tep.',
  'Jsem hladový, promrzlý a před očima se mi dělají mžitky.',
  'Svaly mám ztuhlé jako kámen. Netuším, kolik dní už tu jsem.',
  'Pot mi stéká po zádech, i když je tu zima. Něco je se mnou špatně.',
  'V uších mi zvoní a podlaha se mi zdá nakloněná.',
  'Rty mám popraskané a v puse mám chuť starého kovu.',
  'Srdce mi bije nepravidelně — tahle kobka mě pomalu zabíjí.',
  'Oči mě pálí od tmy a z hlavy mi nejde výraz té čarodějky.'
];
let lastSelfLine = -1;
function examineSelf() {
  let i = Math.floor(Math.random() * SELF_LINES.length);
  if (SELF_LINES.length > 1) while (i === lastSelfLine) i = Math.floor(Math.random() * SELF_LINES.length);
  lastSelfLine = i;
  sayAtHero(SELF_LINES[i]);
}

function drinkPotion() {
  if (dead || escaped) return;
  heldItem = null; stage.style.cursor = CURSORS.walk; renderInventory();
  gesture('use', 1400);
  sayAtHero('Zvedneš lektvar k ústům a napiješ se.');
  setTimeout(() => { if (!dead) sayAtHero('Hrdlem ti projede ledový oheň. Něco je špatně...'); }, 1700);
  setTimeout(() => {
    dead = true;
    heldItem = null;
    stage.style.cursor = CURSORS.walk;
    renderInventory();
    playDeathSound();
    const startT = performance.now(), DUR = 2200;
    function stepFade(t) {
      const p = Math.min(1, (t - startT) / DUR);
      poisonFade = Math.min(1, p / 0.35);
      deathFade = Math.max(0, (p - 0.3) / 0.7);
      if (p < 1) requestAnimationFrame(stepFade);
    }
    requestAnimationFrame(stepFade);
    fadeAudio(bgm, bgm.volume, 0, DUR);
    fadeAudio(bgmDark, bgmDark.volume, 0, DUR);
  }, 3400);
}

function goTo(x, y, onArrive = null) {
  hero.destX = Math.max(80, Math.min(1010, x));
  hero.destY = Math.max(510, Math.min(548, y));
  hero.queued = onArrive;
  if (Math.hypot(hero.destX - hero.x, hero.destY - hero.y) < 4) { const cb = hero.queued; hero.queued = null; if (cb) cb(); }
}

function point(ev) {
  const r = canvas.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width * 1085, (ev.clientY - r.top) / r.height * 566];
}
function getHotspot(x, y) { return currentHotspots().find(h => x >= h.box[0] && x <= h.box[2] && y >= h.box[1] && y <= h.box[3]); }
function isOnHero(x, y) { return Math.abs(x - hero.x) < 105 && y > hero.y - 240 && y < hero.y + 10; }

const HERO_NAME = 'Zubožený žalářník';
canvas.addEventListener('pointermove', ev => {
  if (dead) { hover.classList.remove('show'); stage.style.cursor = 'default'; return; }
  const [x, y] = point(ev), h = getHotspot(x, y), onHero = !h && isOnHero(x, y);
  hover.classList.toggle('show', !!h || onHero);
  if (h) hover.textContent = h.title;
  else if (onHero) hover.textContent = HERO_NAME;
  if (heldItem) stage.style.cursor = HELD_CURSORS[heldItem];
  else if (onHero) stage.style.cursor = CURSORS.examine;
  else stage.style.cursor = CURSORS[cursorForHotspot(h)];
});
canvas.addEventListener('pointerleave', () => { hover.classList.remove('show'); stage.style.cursor = dead ? 'default' : (heldItem ? HELD_CURSORS[heldItem] : CURSORS.walk); });
canvas.addEventListener('click', ev => {
  playClick();
  if (escaped || dead) return;
  const [x, y] = point(ev), h = getHotspot(x, y);
  const onHero = !h && isOnHero(x, y);
  if (onHero && heldItem === 'green_potion') { drinkPotion(); return; }
  if (onHero) { gesture('examine'); examineSelf(); return; }
  if (h && heldItem) { goTo(h.to[0], h.to[1], () => useItemOn(h.id)); }
  else if (h) { goTo(h.to[0], h.to[1], () => inspect(h.id)); }
  else if (y > 360) { hero.queued = null; heldItem = null; stage.style.cursor = CURSORS.walk; renderInventory(); goTo(x, y); }
  else { /* empty wall/background click: just the sound, no message */ }
});

function frame(now) {
  const dt = Math.min((now - (last || now)) / 1000, 0.055);
  last = now;
  const dx = hero.destX - hero.x, dy = hero.destY - hero.y, dist = Math.hypot(dx, dy);
  if (dist > 1.6) {
    hero.face = dx >= 0 ? 'walk_right' : 'walk_left';
    hero.action = hero.face;
    const step = Math.min(dist, 185 * dt);
    hero.x += dx / dist * step; hero.y += dy / dist * step;
    hero.phase += dt * 1000;
  } else if (hero.queued) {
    const cb = hero.queued; hero.queued = null; hero.action = 'idle'; cb();
  } else if (now > hero.actUntil) {
    if (hero.action !== 'idle') hero.phase = 0;
    hero.action = 'idle'; hero.phase += dt * 1000;
  } else { hero.phase += dt * 1000; }

  ctx.clearRect(0, 0, 1085, 566);
  if (images.roomDark?.complete && images.roomDark.naturalWidth) ctx.drawImage(images.roomDark, 0, 0);
  if (litMix > 0 && images.room?.complete && images.room.naturalWidth) {
    ctx.globalAlpha = litMix;
    ctx.drawImage(images.room, 0, 0);
    ctx.globalAlpha = 1;
  }
  if (litMix > 0 && potionMix < 1 && images.potionSprite?.complete && images.potionSprite.naturalWidth) {
    ctx.globalAlpha = litMix * (1 - potionMix);
    ctx.drawImage(images.potionSprite, POTION_POS.x, POTION_POS.y, POTION_POS.w, POTION_POS.h);
    ctx.globalAlpha = 1;
  }
  if (litMix > 0 && chestMix > 0 && images.chestOpen?.complete && images.chestOpen.naturalWidth) {
    ctx.globalAlpha = litMix * chestMix;
    ctx.drawImage(images.chestOpen, CHEST_OPEN_POS.x, CHEST_OPEN_POS.y, CHEST_OPEN_POS.w, CHEST_OPEN_POS.h);
    ctx.globalAlpha = 1;
  }
  if (gameState === 'dark' && matchFade > 0 && images.matchbox?.complete && images.matchbox.naturalWidth) {
    const mW = 46, mH = 46 * (images.matchbox.naturalHeight / images.matchbox.naturalWidth);
    ctx.globalAlpha = 0.09 * matchFade;
    ctx.drawImage(images.matchbox, MATCH_POS[0] - mW / 2, MATCH_POS[1] - mH / 2, mW, mH);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(hero.x, hero.y - 2, 52, 9, 0, 0, Math.PI * 2); ctx.fill();
  const f = hero.action === 'idle' ? idleFrameAt(hero.phase) : Math.floor(hero.phase / frameMs[hero.action]) % aCount[hero.action];
  const img = images[`${hero.action}_${f}`] || images.idle_0;
  if (img?.complete && img.naturalWidth) {
    const scale = 1.13, W = img.naturalWidth * scale, H = img.naturalHeight * scale;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, Math.round(hero.x - W / 2), Math.round(hero.y - H), W, H);
  }
  if (escaped) {
    ctx.fillStyle = 'rgba(64,151,86,.13)'; ctx.fillRect(870, 55, 208, 446);
    ctx.strokeStyle = '#bafa91'; ctx.lineWidth = 4; ctx.strokeRect(900, 99, 168, 373);
  }
  if (poisonFade > 0) {
    ctx.fillStyle = `rgba(45,210,100,${poisonFade * 0.6})`;
    ctx.fillRect(0, 0, 1085, 566);
  }
  if (deathFade > 0) {
    ctx.fillStyle = `rgba(3,12,7,${deathFade})`;
    ctx.fillRect(0, 0, 1085, 566);
  }
  requestAnimationFrame(frame);
}

renderInventory();
requestAnimationFrame(frame);

resetBtn.addEventListener('click', () => {
  playClick();
  found = { iron_key: false, paper: false, green_potion: false };
  openChest = false; escaped = false; dead = false; deathFade = 0; poisonFade = 0; paperRevealed = false;
  ITEM_DEFS.paper.desc = 'List pergamenu, popsaný podivnými, rozmazanými znaky. Možná by pomohlo víc světla.';
  gameState = 'dark'; matchTaken = false; litMix = 0; igniting = false;
  matchFade = 1; potionMix = 0; chestMix = 0;
  hero = { x: 421, y: 515, destX: 421, destY: 515, action: 'idle', face: 'walk_right', actUntil: 0, phase: 0, queued: null };
  heldItem = null; prevInvKeys = []; stage.style.cursor = CURSORS.walk;
  popupEl.classList.remove('show');
  bgm.pause(); bgm.currentTime = 0;
  if (actx) { bgmDark.currentTime = 0; bgmDark.volume = muted ? 0 : 0.5; bgmDark.play().catch(() => {}); }
  renderInventory();
});
})();
</script>
